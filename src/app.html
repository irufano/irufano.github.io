<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var THEMES = [
						'catppuccin', 'terminal', 'tokyo-night', 'dracula', 'nord', 'gruvbox',
						'one-dark', 'solarized', 'kanagawa', 'rose-pine', 'vesper',
						'catppuccin-latte', 'terminal-light', 'tokyo-day', 'gruvbox-light', 'one-light',
						'solarized-light', 'kanagawa-lotus', 'rose-pine-dawn'
					];
					var stored = localStorage.getItem('theme');
					var theme =
						stored && THEMES.indexOf(stored) !== -1
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'terminal'
								: 'one-light';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
