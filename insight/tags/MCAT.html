xt/static/chunks/156cqvtv.tz0c.js\"],\"default\"]\n15:T591b,"])</script><script>self.__next_f.push([1,"\n\u003e **Abstract:** Multidimensional Computer Adaptive Testing (MCAT) extends the classical unidimensional CAT framework to simultaneously estimate multiple latent traits. This document details the theoretical foundations, algorithmic procedures, item selection strategies, ability estimation methods, and stopping rules that govern the MCAT process, with reference to seminal and contemporary literature.\n\n---\n\n## 1. Theoretical Background\n\nMultidimensional Computer Adaptive Testing (MCAT) is a psychometric framework that generalizes unidimensional CAT (UCAT) to settings where examinees possess a **vector of latent traits** rather than a single ability [1][2]. The fundamental motivation is that most cognitive, psychological, and educational constructs are inherently multifaceted; a single scalar cannot adequately characterize proficiency in, for example, mathematics (algebra, geometry, statistics) or language ability (reading, grammar, vocabulary) [3].\n\nMCAT was formalized extensively by Reckase [4] through the development of **Multidimensional Item Response Theory (MIRT)**, which provides the probabilistic measurement model underlying all MCAT procedures. The adaptive component ensures that items administered to an examinee are optimally informative given the current estimate of the **ability vector** $\\boldsymbol{\\theta}$ [1][5].\n\n---\n\n## 2. Item Response Theory in Multiple Dimensions\n\n### 2.1 The Latent Trait Vector\n\nIn MCAT, each examinee is characterized by a $K$-dimensional ability vector:\n\n$$\\boldsymbol{\\theta} = (\\theta_1, \\theta_2, \\ldots, \\theta_K)^{\\top} \\in \\mathbb{R}^K$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\boldsymbol{\\theta}$ | Latent trait (ability) vector |\n| $\\theta_k$ | Latent ability on dimension $k$ |\n| $K$ | Total number of dimensions (latent traits) |\n\n### 2.2 Multidimensional Item Response Model\n\nThe most widely used model in MCAT is the **Multidimensional Two-Parameter Logistic (M2PL)** model [4][6]:\n\n$$P(X_{ij} = 1 \\mid \\boldsymbol{\\theta}_j, \\mathbf{a}_i, d_i) = \\frac{\\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}{1 + \\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $X_{ij}$ | Binary response of examinee $j$ to item $i$ (1 = correct, 0 = incorrect) |\n| $\\boldsymbol{\\theta}_j$ | Ability vector of examinee $j$ |\n| $\\mathbf{a}_i = (a_{i1}, a_{i2}, \\ldots, a_{iK})^{\\top}$ | Discrimination parameter vector for item $i$ on each dimension |\n| $d_i$ | Scalar intercept (difficulty) parameter for item $i$ |\n| $\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j$ | Dot product: $\\sum_{k=1}^{K} a_{ik} \\theta_{jk}$ |\n\nFor the **Multidimensional Three-Parameter Logistic (M3PL)** model with guessing [4][7]:\n\n$$P(X_{ij} = 1 \\mid \\boldsymbol{\\theta}_j) = c_i + (1 - c_i) \\cdot \\frac{\\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}{1 + \\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $c_i$ | Pseudo-guessing parameter for item $i$ ($0 \\leq c_i \u003c 1$) |\n\n### 2.3 Item Information in Multiple Dimensions\n\nThe **Fisher Information Matrix (FIM)** for item $i$ given ability $\\boldsymbol{\\theta}$ is a $K \\times K$ matrix [1][8]:\n\n$$\\mathbf{I}_i(\\boldsymbol{\\theta}) = \\frac{[P'_i(\\boldsymbol{\\theta})]^2}{P_i(\\boldsymbol{\\theta})\\, Q_i(\\boldsymbol{\\theta})} \\cdot \\mathbf{a}_i \\mathbf{a}_i^{\\top}$$\n\nwhere:\n\n$$P'_i(\\boldsymbol{\\theta}) = \\frac{\\partial P_i(\\boldsymbol{\\theta})}{\\partial (\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta})} = P_i(\\boldsymbol{\\theta})\\, Q_i(\\boldsymbol{\\theta})$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\mathbf{I}_i(\\boldsymbol{\\theta})$ | $K \\times K$ Fisher Information Matrix for item $i$ |\n| $P_i(\\boldsymbol{\\theta})$ | Probability of correct response to item $i$ |\n| $Q_i(\\boldsymbol{\\theta}) = 1 - P_i(\\boldsymbol{\\theta})$ | Probability of incorrect response |\n| $P'_i(\\boldsymbol{\\theta})$ | Derivative of $P_i$ with respect to the linear predictor |\n| $\\mathbf{a}_i \\mathbf{a}_i^{\\top}$ | Outer product of the discrimination vector (rank-1 matrix) |\n\nThe **cumulative FIM** after administering $n$ items is:\n\n$$\\mathbf{I}_{(n)}(\\boldsymbol{\\theta}) = \\sum_{i=1}^{n} \\mathbf{I}_i(\\boldsymbol{\\theta})$$\n\n---\n\n## 3. The MCAT Process Overview\n\nThe following diagram illustrates the complete MCAT procedure from initialization to termination:\n\n```mermaid\nflowchart TD\n    A([Start: Examinee Begins Test]) --\u003e B[Initialize Ability Estimate\\n θ̂ = θ₀, e.g., 0-vector]\n    B --\u003e C[Select Starting Items\\nfrom Item Bank]\n    C --\u003e D{Item Bank\\nAvailable?}\n    D -- No --\u003e Z([Error: Insufficient Items])\n    D -- Yes --\u003e E[Select Optimal Item\\nusing Selection Criterion]\n    E --\u003e F[Administer Item to Examinee]\n    F --\u003e G[\"Record Response\\nXᵢ ∈ {0, 1}\"]\n    G --\u003e H[Update Ability Estimate\\nθ̂ via MLE / MAP / EAP]\n    H --\u003e I[Update Fisher\\nInformation Matrix I_n]\n    I --\u003e J{Stopping Rule\\nSatisfied?}\n    J -- No --\u003e K{Exposure \u0026\\nContent Constraints Met?}\n    K -- Yes --\u003e E\n    K -- No --\u003e L[Apply Constrained\\nItem Selection]\n    L --\u003e E\n    J -- Yes --\u003e M[Final Ability Estimate\\nθ̂_final with SE]\n    M --\u003e N[Generate Score Report]\n    N --\u003e O([End: Test Complete])\n\n    style A fill:#2d6a4f,color:#fff\n    style O fill:#2d6a4f,color:#fff\n    style Z fill:#b5192b,color:#fff\n    style J fill:#1d3557,color:#fff\n    style K fill:#1d3557,color:#fff\n```\n\n---\n\n## 4. Step-by-Step Procedure\n\n### Step 1: Initialization\n\nBefore any item is administered, the system establishes:\n\n- **Prior ability distribution:** $\\boldsymbol{\\theta}_0 \\sim \\mathcal{N}(\\boldsymbol{\\mu}_0, \\boldsymbol{\\Sigma}_0)$, typically $\\boldsymbol{\\mu}_0 = \\mathbf{0}$, $\\boldsymbol{\\Sigma}_0 = \\mathbf{I}_K$ (identity matrix) [2][9]\n- **Item bank:** A calibrated pool $\\mathcal{B}$ of $M$ items with known MIRT parameters $\\{\\mathbf{a}_i, d_i, c_i\\}$\n- **Starting ability estimate:** $\\hat{\\boldsymbol{\\theta}}^{(0)} = \\boldsymbol{\\mu}_0$\n\n### Step 2: Item Selection\n\nAt step $n$, the item $i^*$ is selected from the remaining bank $\\mathcal{B}_n = \\mathcal{B} \\setminus \\{i_1, \\ldots, i_{n-1}\\}$ using a selection criterion $\\mathcal{S}$:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\mathcal{S}\\left(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}}^{(n-1)})\\right)$$\n\nCommon criteria are detailed in [Section 6](#6-item-selection-criteria).\n\n### Step 3: Item Administration\n\nItem $i^*$ is presented to the examinee who provides response $x_{i^*} \\in \\{0, 1\\}$ (for dichotomous items) or $x_{i^*} \\in \\{0, 1, \\ldots, m_i\\}$ (polytomous items).\n\n### Step 4: Ability Re-estimation\n\nThe ability vector is updated using accumulated response vector $\\mathbf{x}^{(n)} = (x_{i_1}, \\ldots, x_{i_n})^{\\top}$.\n\n**Log-likelihood function** [1][6]:\n\n$$\\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}) = \\sum_{t=1}^{n} \\left[ x_{i_t} \\ln P_{i_t}(\\boldsymbol{\\theta}) + (1 - x_{i_t}) \\ln Q_{i_t}(\\boldsymbol{\\theta}) \\right]$$\n\nDetails of estimation methods are in [Section 5](#5-ability-estimation-methods).\n\n### Step 5: Update Information Matrix\n\n$$\\mathbf{I}_{(n)}(\\hat{\\boldsymbol{\\theta}}^{(n)}) = \\sum_{t=1}^{n} \\mathbf{I}_{i_t}(\\hat{\\boldsymbol{\\theta}}^{(n)})$$\n\n### Step 6: Check Stopping Rule\n\nEvaluate whether stopping criteria are satisfied (see [Section 7](#7-stopping-rules)). If yes → proceed to scoring; if no → return to Step 2.\n\n### Step 7: Score Reporting\n\nProvide the final estimate $\\hat{\\boldsymbol{\\theta}}_{\\text{final}}$ along with the **standard error vector**:\n\n$$\\text{SE}(\\hat{\\boldsymbol{\\theta}}) = \\sqrt{\\text{diag}\\left[\\mathbf{I}_{(n)}^{-1}(\\hat{\\boldsymbol{\\theta}})\\right]}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\text{SE}(\\hat{\\boldsymbol{\\theta}})$ | Vector of standard errors for each dimension estimate |\n| $\\text{diag}[\\cdot]$ | Diagonal extraction operator |\n| $\\mathbf{I}_{(n)}^{-1}$ | Inverse of the cumulative FIM (posterior covariance approximation) |\n\n---\n\n## 5. Ability Estimation Methods\n\n### 5.1 Maximum Likelihood Estimation (MLE)\n\nMLE finds $\\hat{\\boldsymbol{\\theta}}$ by maximizing the log-likelihood [1][10]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{MLE}} = \\underset{\\boldsymbol{\\theta}}{\\arg\\max} \\; \\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)})$$\n\nThe **score function** (gradient):\n\n$$\\mathbf{s}(\\boldsymbol{\\theta}) = \\nabla_{\\boldsymbol{\\theta}} \\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}) = \\sum_{t=1}^{n} \\frac{x_{i_t} - P_{i_t}(\\boldsymbol{\\theta})}{P_{i_t}(\\boldsymbol{\\theta}) Q_{i_t}(\\boldsymbol{\\theta})} \\cdot P'_{i_t}(\\boldsymbol{\\theta}) \\cdot \\mathbf{a}_{i_t}$$\n\nSolved via Newton-Raphson iteration [10]:\n\n$$\\hat{\\boldsymbol{\\theta}}^{(r+1)} = \\hat{\\boldsymbol{\\theta}}^{(r)} + \\left[\\mathbf{I}_{(n)}(\\hat{\\boldsymbol{\\theta}}^{(r)})\\right]^{-1} \\mathbf{s}(\\hat{\\boldsymbol{\\theta}}^{(r)})$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $r$ | Iteration index in Newton-Raphson |\n| $\\mathbf{s}(\\boldsymbol{\\theta})$ | Score function (gradient of log-likelihood) |\n\n\u003e ⚠️ **Limitation:** MLE is undefined when all responses are correct or all incorrect (degenerate response patterns) [2].\n\n### 5.2 Maximum A Posteriori (MAP) Estimation\n\nMAP incorporates a prior distribution $g(\\boldsymbol{\\theta})$ (typically multivariate normal) [2][9]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{MAP}} = \\underset{\\boldsymbol{\\theta}}{\\arg\\max} \\left[ \\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}) + \\ln g(\\boldsymbol{\\theta}) \\right]$$\n\nWith a multivariate normal prior $\\boldsymbol{\\theta} \\sim \\mathcal{N}(\\boldsymbol{\\mu}_0, \\boldsymbol{\\Sigma}_0)$:\n\n$$\\ln g(\\boldsymbol{\\theta}) = -\\frac{1}{2}(\\boldsymbol{\\theta} - \\boldsymbol{\\mu}_0)^{\\top} \\boldsymbol{\\Sigma}_0^{-1} (\\boldsymbol{\\theta} - \\boldsymbol{\\mu}_0) + \\text{const}$$\n\nThe modified Newton-Raphson step becomes:\n\n$$\\hat{\\boldsymbol{\\theta}}^{(r+1)}_{\\text{MAP}} = \\hat{\\boldsymbol{\\theta}}^{(r)} + \\left[\\mathbf{I}_{(n)}(\\hat{\\boldsymbol{\\theta}}^{(r)}) + \\boldsymbol{\\Sigma}_0^{-1}\\right]^{-1} \\left[\\mathbf{s}(\\hat{\\boldsymbol{\\theta}}^{(r)}) - \\boldsymbol{\\Sigma}_0^{-1}(\\hat{\\boldsymbol{\\theta}}^{(r)} - \\boldsymbol{\\mu}_0)\\right]$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $g(\\boldsymbol{\\theta})$ | Prior density of ability vector |\n| $\\boldsymbol{\\mu}_0$ | Prior mean vector (often $\\mathbf{0}$) |\n| $\\boldsymbol{\\Sigma}_0$ | Prior covariance matrix |\n| $\\boldsymbol{\\Sigma}_0^{-1}$ | Precision matrix of the prior |\n\n### 5.3 Expected A Posteriori (EAP) Estimation\n\nEAP computes the **posterior mean** [9][11]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{EAP}} = \\mathbb{E}[\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}] = \\frac{\\int \\boldsymbol{\\theta} \\cdot L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}) \\cdot g(\\boldsymbol{\\theta}) \\, d\\boldsymbol{\\theta}}{\\int L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}) \\cdot g(\\boldsymbol{\\theta}) \\, d\\boldsymbol{\\theta}}$$\n\nwhere the likelihood:\n\n$$L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}) = \\prod_{t=1}^{n} P_{i_t}(\\boldsymbol{\\theta})^{x_{i_t}} Q_{i_t}(\\boldsymbol{\\theta})^{1 - x_{i_t}}$$\n\nIn practice, EAP is computed via **Gauss-Hermite quadrature** or **Monte Carlo integration** over a grid of quadrature points $\\{\\boldsymbol{\\theta}^{(q)}, w^{(q)}\\}$ [9]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{EAP}} \\approx \\frac{\\sum_{q} \\boldsymbol{\\theta}^{(q)} \\cdot L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}^{(q)}) \\cdot g(\\boldsymbol{\\theta}^{(q)}) \\cdot w^{(q)}}{\\sum_{q} L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}^{(q)}) \\cdot g(\\boldsymbol{\\theta}^{(q)}) \\cdot w^{(q)}}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\boldsymbol{\\theta}^{(q)}$ | $q$-th quadrature point in the $K$-dimensional grid |\n| $w^{(q)}$ | Quadrature weight for point $q$ |\n| $L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta})$ | Likelihood of observed responses given $\\boldsymbol{\\theta}$ |\n\n---\n\n## 6. Item Selection Criteria\n\n### 6.1 Maximum Determinant (D-optimality)\n\nSelect the item that maximizes the determinant of the updated FIM [1][8][12]:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\det\\left[\\mathbf{I}_{(n-1)}(\\hat{\\boldsymbol{\\theta}}) + \\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})\\right]$$\n\n**Interpretation:** Maximizes the volume of the confidence ellipsoid's reciprocal — reduces overall estimation uncertainty across all dimensions simultaneously.\n\n### 6.2 Minimum Trace of Posterior Covariance (T-optimality / A-optimality)\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\min} \\; \\text{tr}\\left[\\left(\\mathbf{I}_{(n-1)}(\\hat{\\boldsymbol{\\theta}}) + \\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})\\right)^{-1}\\right]$$\n\n**Interpretation:** Minimizes the sum of posterior variances across all $K$ dimensions [5][13].\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\text{tr}[\\cdot]$ | Matrix trace operator (sum of diagonal elements) |\n| $\\det[\\cdot]$ | Matrix determinant |\n\n### 6.3 Kullback-Leibler Information (KL-criterion)\n\nMaximizes the expected Kullback-Leibler divergence between item response distributions at the current estimate and neighboring ability values [14]:\n\n$$\\text{KL}_i(\\hat{\\boldsymbol{\\theta}}) = \\int_{\\mathcal{V}} \\sum_{x=0}^{1} P(X_i = x \\mid \\hat{\\boldsymbol{\\theta}}) \\ln \\frac{P(X_i = x \\mid \\hat{\\boldsymbol{\\theta}})}{P(X_i = x \\mid \\boldsymbol{\\theta})} \\, d\\boldsymbol{\\theta}$$\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\text{KL}_i(\\hat{\\boldsymbol{\\theta}})$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\mathcal{V}$ | Neighborhood region around $\\hat{\\boldsymbol{\\theta}}$ |\n| $\\text{KL}_i(\\hat{\\boldsymbol{\\theta}})$ | KL information for item $i$ at current ability estimate |\n\n### 6.4 Mutual Information Criterion\n\nSelects items that maximize the mutual information between the item response and the ability vector [15]:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\mathbb{I}(X_i ; \\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n-1)})$$\n\n### Summary Comparison\n\n```mermaid\ngraph LR\n    A[Item Selection Criteria] --\u003e B[D-optimality\\n det of FIM]\n    A --\u003e C[A-optimality\\n trace of FIM⁻¹]\n    A --\u003e D[KL-criterion\\n information gain]\n    A --\u003e E[Mutual Information\\n Bayesian criterion]\n    B --\u003e F[Best for joint\\n precision]\n    C --\u003e G[Best for average\\n dimension precision]\n    D --\u003e H[Best for local\\n discrimination]\n    E --\u003e I[Best for fully\\n Bayesian settings]\n```\n\n---\n\n## 7. Stopping Rules\n\n### 7.1 Fixed Test Length\n\nThe simplest rule: terminate after exactly $N_{\\max}$ items [1]:\n\n$$\\text{Stop if } n = N_{\\max}$$\n\n### 7.2 Standard Error Threshold\n\nTerminate when the standard error for **all** dimensions falls below a threshold $\\epsilon$ [2][5]:\n\n$$\\text{Stop if } \\max_{k \\in \\{1,\\ldots,K\\}} \\text{SE}(\\hat{\\theta}_k) \\leq \\epsilon$$\n\nOr alternatively for the joint criterion using the posterior covariance matrix:\n\n$$\\text{Stop if } \\text{tr}\\left[\\mathbf{I}_{(n)}^{-1}(\\hat{\\boldsymbol{\\theta}})\\right] \\leq \\epsilon^2_{\\text{joint}}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\epsilon$ | Standard error threshold (e.g., 0.30 on the logit scale) |\n| $\\epsilon^2_{\\text{joint}}$ | Joint variance threshold for all dimensions |\n\n### 7.3 Change in Ability Estimate\n\nTerminate when successive ability estimates converge [16]:\n\n$$\\text{Stop if } \\left\\| \\hat{\\boldsymbol{\\theta}}^{(n)} - \\hat{\\boldsymbol{\\theta}}^{(n-1)} \\right\\|_2 \\leq \\delta$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\|\\cdot\\|_2$ | Euclidean (L2) norm |\n| $\\delta$ | Convergence threshold (e.g., 0.01) |\n\n### 7.4 Minimum-Maximum Length Rule (Hybrid)\n\nCombines fixed and SE-based rules for practical testing [2][5]:\n\n$$\\text{Stop if } n \\geq N_{\\min} \\text{ AND } \\left(\\max_k \\text{SE}(\\hat{\\theta}_k) \\leq \\epsilon \\text{ OR } n = N_{\\max}\\right)$$\n\n```mermaid\nflowchart LR\n    A[After each item n] --\u003e B{n ≥ N_min?}\n    B -- No --\u003e F[Continue]\n    B -- Yes --\u003e C{SE ≤ ε\\nfor all k?}\n    C -- Yes --\u003e D([Stop: Precision Met])\n    C -- No --\u003e E{n = N_max?}\n    E -- Yes --\u003e G([Stop: Max Length])\n    E -- No --\u003e F\n```\n\n---\n\n## 8. Item Exposure Control\n\nUncontrolled item selection leads to overexposure of highly informative items, compromising item security. Several methods address this [17][18]:\n\n### 8.1 Sympson-Hetter Method (Randomization)\n\nEach item $i$ is selected with probability $r_i$, where $r_i$ is tuned so that the exposure rate $\\varrho_i \\leq \\varrho_{\\max}$ [17]:\n\n$$r_i = \\min\\left(1, \\frac{\\varrho_{\\max}}{\\varrho_i^{*}}\\right)$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\varrho_i$ | Observed exposure rate of item $i$ |\n| $\\varrho_{\\max}$ | Maximum allowable exposure rate (e.g., 0.20) |\n| $\\varrho_i^{*}$ | Unconditional selection probability of item $i$ |\n| $r_i$ | Randomization parameter for item $i$ |\n\n### 8.2 Maximum Priority Index (MPI)\n\nUses a priority index $\\text{PI}_i$ combining information and exposure [18]:\n\n$$\\text{PI}_i = w_1 \\cdot \\mathcal{S}(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})) - w_2 \\cdot \\varrho_i$$\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\text{PI}_i$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $w_1, w_2$ | Weights balancing information gain vs. exposure penalization |\n| $\\mathcal{S}(\\cdot)$ | Item selection criterion value (e.g., determinant) |\n\n---\n\n## 9. Content Balancing\n\nReal-world tests require that items cover specified content areas $\\mathcal{C} = \\{c_1, c_2, \\ldots, c_J\\}$ proportionally [19]. The **constrained CAT** problem is:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n \\cap \\mathcal{C}_j^{\\text{eligible}}}{\\arg\\max} \\; \\mathcal{S}\\left(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})\\right)$$\n\nwhere $\\mathcal{C}_j^{\\text{eligible}}$ is the set of items from content area $c_j$ that can still be administered to meet the target distribution $\\boldsymbol{\\pi} = (\\pi_1, \\ldots, \\pi_J)^{\\top}$ [19][20].\n\nThe **Shadow Test** approach [20] solves a 0-1 integer programming problem at each step to select a full-length \"shadow test\" that satisfies all constraints, then administers only the optimal next item from it:\n\n$$\\text{Maximize} \\quad \\sum_{i \\in \\mathcal{B}} s_i \\cdot \\mathcal{S}(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}}))$$\n$$\\text{subject to} \\quad \\sum_{i \\in \\mathcal{C}_j} s_i = n_j, \\quad j = 1, \\ldots, J$$\n$$s_i \\in \\{0, 1\\}, \\quad \\sum_{i} s_i = N_{\\max}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $s_i$ | Binary decision variable (1 if item $i$ included in shadow test) |\n| $n_j$ | Required number of items from content area $j$ |\n| $\\pi_j$ | Target proportion for content area $j$ |\n\n---\n\n## 10. Comparison: Unidimensional vs. Multidimensional CAT\n\n| Feature | Unidimensional CAT | Multidimensional CAT |\n|---------|-------------------|---------------------|\n| **Latent space** | Scalar $\\theta \\in \\mathbb{R}$ | Vector $\\boldsymbol{\\theta} \\in \\mathbb{R}^K$ |\n| **Item information** | Scalar $I_i(\\theta)$ | Matrix $\\mathbf{I}_i(\\boldsymbol{\\theta}) \\in \\mathbb{R}^{K \\times K}$ |\n| **Estimation** | MLE/MAP (1D optimization) | MLE/MAP (K-D optimization) |\n| **Item selection** | Maximize $I_i(\\hat{\\theta})$ | Maximize $\\det / \\text{tr}^{-1}$ of FIM |\n| **Stopping rule** | $\\text{SE}(\\hat{\\theta}) \\leq \\epsilon$ | $\\max_k \\text{SE}(\\hat{\\theta}_k) \\leq \\epsilon$ |\n| **Computational cost** | Low | Higher (matrix operations) |\n| **Score report** | Single score + SE | Score profile + SE vector |\n| **Between-dimension correlation** | Not applicable | $\\text{Corr}(\\theta_j, \\theta_k)$ estimated |\n\n---\n\n## References\n\n[1] Segall, D. O. (1996). Multidimensional adaptive testing. *Psychometrika*, 61(2), 331–354.\n\n[2] Reckase, M. D., \u0026 Segall, D. O. (2009). Multidimensional adaptive testing. In W. J. van der Linden \u0026 C. A. W. Glas (Eds.), *Elements of Adaptive Testing* (pp. 203–217). Springer.\n\n[3] van der Linden, W. J., \u0026 Hambleton, R. K. (Eds.). (1997). *Handbook of Modern Item Response Theory*. Springer.\n\n[4] Reckase, M. D. (2009). *Multidimensional Item Response Theory*. Springer.\n\n[5] Mulder, J., \u0026 van der Linden, W. J. (2009). Multidimensional adaptive testing with Kullback-Leibler information item selection. In W. J. van der Linden \u0026 C. A. W. Glas (Eds.), *Elements of Adaptive Testing* (pp. 77–101). Springer.\n\n[6] McKinley, R. L., \u0026 Reckase, M. D. (1983). An extension of the two-parameter logistic model to the multidimensional latent space. *ETS Research Report*. Educational Testing Service.\n\n[7] Reckase, M. D. (1985). The difficulty of test items that measure more than one ability. *Applied Psychological Measurement*, 9(4), 401–412.\n\n[8] Berger, M. P. F. (1992). Sequential sampling designs for the two-parameter item response theory model. *Psychometrika*, 57(4), 521–538.\n\n[9] Bock, R. D., \u0026 Mislevy, R. J. (1982). Adaptive EAP estimation of ability in a microcomputer environment. *Applied Psychological Measurement*, 6(4), 431–444.\n\n[10] Lord, F. M. (1980). *Applications of Item Response Theory to Practical Testing Problems*. Lawrence Erlbaum.\n\n[11] Mislevy, R. J. (1986). Bayes modal estimation in item response models. *Psychometrika*, 51(2), 177–195.\n\n[12] Silvey, S. D. (1980). *Optimal Design*. Chapman and Hall.\n\n[13] van der Linden, W. J. (1999). Multidimensional adaptive testing with a minimum error-variance criterion. *Journal of Educational and Behavioral Statistics*, 24(4), 398–412.\n\n[14] Chang, H.-H., \u0026 Ying, Z. (1996). A global information approach to computerized adaptive testing. *Applied Psychological Measurement*, 20(3), 213–229.\n\n[15] Cover, T. M., \u0026 Thomas, J. A. (2006). *Elements of Information Theory* (2nd ed.). Wiley.\n\n[16] Weiss, D. J. (1982). Improving measurement quality and efficiency with adaptive testing. *Applied Psychological Measurement*, 6(4), 473–492.\n\n[17] Sympson, J. B., \u0026 Hetter, R. D. (1985). *Controlling item-exposure rates in computerized adaptive testing*. Proceedings of the 27th Annual Meeting of the Military Testing Association.\n\n[18] Leung, C. K., Chang, H.-H., \u0026 Hau, K.-T. (2002). Item selection in computerized adaptive testing: Improving the a-stratified design with the Sympson-Hetter algorithm. *Applied Psychological Measurement*, 26(4), 376–392.\n\n[19] Stocking, M. L., \u0026 Swanson, L. (1993). A method for severely constrained item selection in adaptive testing. *Applied Psychological Measurement*, 17(3), 277–292.\n\n[20] van der Linden, W. J. (2005). *Linear Models for Optimal Test Design*. Springer.\n\n---\n\n*Document prepared with reference to foundational MIRT and MCAT literature. All mathematical notation follows standard psychometric conventions. LaTeX formulas are rendered in Markdown-compatible environments (e.g., Obsidian, Jupyter, Pandoc with MathJax/KaTeX).*\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L13\",null,{\"type\":\"$undefined\",\"children\":[\"$\",\"$7\",null,{\"children\":[\"$\",\"$L14\",null,{\"posts\":[{\"slug\":\"multidimension-cat-procedure\",\"meta\":{\"title\":\"Multidimensional Computer Adaptive Testing (MCAT): Procedure and Process\",\"date\":\"2026-05-20\",\"description\":\"Multidimensional Computer Adaptive Testing (MCAT) extends the classical unidimensional CAT framework to simultaneously estimate multiple latent traits. This document details the theoretical foundations, algorithmic procedures, item selection strategies, ability estimation methods, and stopping rules that govern the MCAT process, with reference to seminal and contemporary literature.\",\"author\":\"irufano\",\"tags\":[\"AI\",\"CAT\",\"MCAT\",\"Adaptive Test\"],\"image\":\"https://www.assessmentworkshop.com/wp-content/uploads/2022/04/CAT-Infographic.png\",\"category\":\"CAT\"},\"rawContent\":\"$15\",\"readingTime\":\"14 min read\"}],\"tag\":\"MCAT\"}]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"title\",\"0\",{\"children\":\"Irufano Dev - Developer Portal\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A tech docs, insights about the software development and also provides several tools for anyone who need it\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Irufano Dev - Developer Portal\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:descriptio
