termined questions, CAT dynamically selects items based on the test-taker's estimated ability as they progress through the test [2]. The result is a test that is smarter, shorter, fairer, and more precise [3].\n\n---\n\n## Part 1: The Five Implementation Steps\n\nAccording to Seo (2017), there are **five steps** for implementing a CAT system [4]:\n\n### Step 1 — Determine Feasibility\nBefore building a CAT, the test program must evaluate whether CAT is appropriate:\n- Is there a sufficient volume of test-takers to calibrate items? (Rule of thumb: at least 200–300 per item)\n- Is the construct **unidimensional** (measuring one trait)? IRT-based CAT assumes this\n- Is the item bank large enough? (Recommended: at least 3× the intended test length) [3]\n- Are there sufficient resources to build and maintain the platform?\n  \n\u003e [note]:\n\u003e\n\u003e If the test volume is very small (e.g., fewer than 100 test-takers per year), it may be impossible to build a usable item bank. It is not unusual for a testing program to start with a fixed-form test and later transition to CAT once the item bank is well established [5].\n\n### Step 2 — Establish an Item Bank\nThe item bank is the foundation of CAT. It must:\n- Contain a large pool of **pre-calibrated items** with known IRT parameters\n- Cover the full range of the ability scale (very easy to very hard)\n- Be organized with content categories for content balancing\n- Items must be **pilot-tested** on a representative sample before entering the live bank\n\n\u003e [note]:\n\u003e\n\u003e \"You can't just write a few items and subjectively rank them as Easy, Medium, or Hard. Instead, you need to write a large number of items and then pilot them on a representative sample of examinees.\" [3]\n\n### Step 3 — Pretest, Calibrate, and Link Item Parameters\nEach item must be statistically calibrated through:\n- **Pilot testing** on real examinees\n- **IRT calibration** — estimating the $a$ (discrimination), $b$ (difficulty), and $c$ (guessing) parameters\n- **Linking** — placing all items on the same IRT scale so they are comparable\n\nThis is done through statistical analysis using actual candidate response data [4].\n\n### Step 4 — Specify the Five CAT Algorithm Components\nThe test developer must define all five components of the CAT algorithm (see Part 2 below) [4]:\n1. Item bank structure\n2. Starting item/point\n3. Item selection rule\n4. Scoring procedure\n5. Termination criterion\n\n### Step 5 — Deploy the CAT\nAfter specifying all components, the CAT is deployed. Ongoing management includes:\n- Content balancing\n- Item analysis and refreshment\n- Standard setting\n- Item exposure monitoring\n- Item bank updates [4]\n\n---\n\n## Part 2: The Five Core Algorithm Components\n\n### Component 1: Item Bank\n\nThe item bank is a pool of pre-calibrated items, each with known IRT parameters [4, 5].\n\nKey requirements:\n- **Size:** Typically at least 5–10× the test length to allow adequate item selection and exposure control\n- **Coverage:** Items spanning the full difficulty range ($-3 \\leq \\theta \\leq 3$)\n- **Content balance:** Items organized by content domain/category\n- **Parameters:** Each item has at minimum a difficulty ($b$) parameter; ideally also discrimination ($a$) and guessing ($c$) for the 3PL model\n\n---\n\n### Component 2: Starting Point\n\nThe starting point determines where the test begins on the ability scale. There are three common options [1, 3]:\n\n| Option | Description | Use Case |\n|---|---|---|\n| **Fixed value** | Everyone starts at $\\hat{\\theta}_0 = 0$ (population mean) | Most common for general tests |\n| **Randomized** | Start within a narrow range, e.g., $\\hat{\\theta}_0 \\in [-0.5,\\ 0.5]$ | Improves test security and item exposure |\n| **Predicted value** | Based on prior data or external information | When prior ability estimate is available |\n\n\u003e [note]:\n\u003e \n\u003e \"At the initial stages of a CAT, when only a single item or two has been administered, the next item is usually selected by a step rule — if the first item was answered correctly, the examinee's original theta estimate is increased by some amount (e.g., 0.50); if the first item was answered incorrectly, the original theta estimate is decreased by the same amount.\" [1]\n\n---\n\n### Component 3: Item Selection Rule (Algorithm)\n\nThis is the **heart of the CAT**. After each response, the algorithm selects the next best item from the unused items in the bank [5].\n\nThe item selection process involves three sub-components [5]:\n\n#### 3a. Item Selection Criterion\n\nThe most common methods are `Maximum Fisher Information` and `b-Matching` [5, 6]:\n\n**Maximum Fisher Information (most common)**\n\nSelects the item $i^*$ providing the highest statistical information at the current ability estimate $\\hat{\\theta}$:\n\n$$i^* = \\underset{i \\notin \\mathcal{U}}{\\arg\\max}\\ I_i(\\hat{\\theta})$$\n\nWhere $I_i(\\hat{\\theta})$ is the Item Information Function (IIF) evaluated at $\\hat{\\theta}$, and $\\mathcal{U}$ is the set of already-used items.\n\nFor the **3-Parameter Logistic (3PL)** model, the IIF is:\n\n$$I_i(\\theta) = \\frac{a_i^2 \\left[P_i(\\theta) - c_i\\right]^2}{(1 - c_i)^2} \\cdot \\frac{1 - P_i(\\theta)}{P_i(\\theta)}$$\n\nWhere $P_i(\\theta)$ is the probability of a correct response given by the 3PL model:\n\n$$P_i(\\theta) = c_i + \\frac{1 - c_i}{1 + e^{-a_i(\\theta - b_i)}}$$\n\n**b-Matching (difficulty matching)**\n\nSelects the item whose difficulty $b_i$ is closest to the current theta estimate:\n\n$$i^* = \\underset{i \\notin \\mathcal{U}}{\\arg\\min}\\ |b_i - \\hat{\\theta}|$$\n\nSimple but effective; does not require full IIF calculation.\n\n**Other criteria:** $a$-stratification, weighted likelihood, Kullback-Leibler information [5].\n\n#### 3b. Content Balancing\nEnsures the test covers required content domains proportionally — not just statistically optimal items. This addresses the concern of educators and subject matter experts who require balanced content coverage [2, 5].\n\n#### 3c. Item Exposure Control\nPrevents certain items from being administered too frequently, which would compromise test security [5]. Common methods:\n- **Randomesque method** — randomly selects from the top-$k$ most informative items\n- **Sympson-Hetter method** — probabilistically suppresses overexposed items\n- **Fade-away method** — gradually reduces exposure of frequently used items\n\n\u003e [note]:\n\u003e\n\u003e \"Selecting the right method for each of the 3 components of the item selection process — content balancing, the item selection criterion, and item exposure control — is not straightforward and cannot be considered separately for each of these 3 components because of the unique interactions among them.\" [5]\n\n---\n\n### Component 4: Scoring Procedure (Theta Estimation)\n\nAfter each response, the test-taker's ability estimate $\\hat{\\theta}$ is updated [2, 6].\n\nThe scoring algorithm takes all previous responses into account — not just the most recent one. Let $\\mathbf{u} = (u_1, u_2, \\ldots, u_n)$ denote the vector of responses where $u_j = 1$ if correct and $u_j = 0$ if incorrect.\n\n#### Maximum Likelihood Estimation (MLE)\n\nFinds the $\\hat{\\theta}$ that maximizes the likelihood of the observed response pattern:\n\n$$\\hat{\\theta}_{MLE} = \\underset{\\theta}{\\arg\\max}\\ L(\\theta \\mid \\mathbf{u})$$\n\nThe likelihood function is:\n\n$$L(\\theta \\mid \\mathbf{u}) = \\prod_{j=1}^{n} P_j(\\theta)^{u_j} \\left[1 - P_j(\\theta)\\right]^{1 - u_j}$$\n\nIn practice, the log-likelihood is maximized:\n\n$$\\ell(\\theta) = \\sum_{j=1}^{n} \\left[ u_j \\ln P_j(\\theta) + (1 - u_j) \\ln(1 - P_j(\\theta)) \\right]$$\n\n- **Pro:** Unbiased estimate\n- **Con:** Undefined when all responses are correct or all incorrect [1]\n\n#### Bayesian EAP (Expected A Posteriori)\n\nCombines the likelihood with a prior distribution $\\pi(\\theta)$ (typically standard normal $\\mathcal{N}(0, 1)$):\n\n$$\\hat{\\theta}_{EAP} = \\frac{\\int_{-\\infty}^{\\infty} \\theta \\cdot L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta)\\ d\\theta}{\\int_{-\\infty}^{\\infty} L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta)\\ d\\theta}$$\n\n- **Pro:** Works even with all-correct or all-incorrect response patterns\n- **Pro:** Provides a natural standard error estimate\n- **Con:** Slightly biased toward the prior mean in early items [6]\n\n#### Bayesian MAP (Maximum A Posteriori)\n\nTakes the mode of the posterior distribution:\n\n$$\\hat{\\theta}_{MAP} = \\underset{\\theta}{\\arg\\max}\\ \\left[ L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta) \\right]$$\n\nIntermediate between MLE and EAP in terms of bias and variance.\n\n\u003e [note]:\n\u003e\n\u003e \"The algorithm then selects the most informative item from the calibrated item bank based on this estimate. After the examinee responds, the ability estimate is updated using maximum likelihood or Bayesian methods, and the cycle continues until a stopping criterion is met.\" [6]\n\n#### Standard Error of Measurement (SEM)\n\nThe precision of the theta estimate is tracked via the **Test Information Function**:\n\n$$\\text{TIF}(\\theta) = \\sum_{j=1}^{n} I_j(\\theta)$$\n\nThe Standard Error of Measurement is:\n\n$$SE(\\hat{\\theta}) = \\frac{1}{\\sqrt{\\text{TIF}(\\hat{\\theta})}} = \\frac{1}{\\sqrt{\\sum_{j=1}^{n} I_j(\\hat{\\theta})}}$$\n\nThe SEM **decreases** as more items are administered. CAT continues until $SE(\\hat{\\theta})$ falls below a specified threshold.\n\n---\n\n### Component 5: Termination Criterion\n\nThe stopping rule decides when to end the test. Common criteria [2, 4, 6]:\n\n| Criterion | Condition | Advantage |\n|---|---|---|\n| **Fixed length** | Stop after $N$ items | Simple, equal testing time |\n| **Fixed precision** | Stop when $SE(\\hat{\\theta}) \u003c \\epsilon$ | Precision-based; adaptive length |\n| **Combined** | Stop when $SE(\\hat{\\theta}) \u003c \\epsilon$ OR $n \\geq N_{max}$ | Balances precision and efficiency |\n| **Classification** | Stop when ability is clearly above/below a cut score $\\theta_c$ | Used in pass/fail exams (e.g., NCLEX) |\n| **Time limit** | Stop after maximum time $T$ | Practical constraint |\n\nFor **classification-based** stopping (e.g., pass/fail), the decision rule is:\n\n$$\\text{Decision} = \\begin{cases} \\text{Pass} \u0026 \\text{if } \\hat{\\theta} - z_{\\alpha/2} \\cdot SE(\\hat{\\theta}) \u003e \\theta_c \\\\ \\text{Fail} \u0026 \\text{if } \\hat{\\theta} + z_{\\alpha/2} \\cdot SE(\\hat{\\theta}) \u003c \\theta_c \\\\ \\text{Continue} \u0026 \\text{otherwise} \\end{cases}$$\n\nWhere $\\theta_c$ is the passing cut score and $z_{\\alpha/2}$ is the critical value at significance level $\\alpha$.\n\n\u003e [note]:\n\u003e \n\u003e \"Fixed-length tests administer a predetermined number of items, while precision-based stopping continues until the standard error of measurement falls below a threshold.\" [6]\n\n\u003e [note]:\n\u003e\n\u003e For high-stakes exams like the NCLEX:\n\u003e \"This pattern continues until you run out of time or until the computer identifies your competency level as above or below the passing standard.\" [7]\n\n---\n\n## Part 3: The Full CAT Runtime Process\n\nOnce deployed, the following iterative process runs for each test-taker [2, 33]:\n\n```mermaid\nflowchart TD\n    A([Start]) --\u003e B[\"1. Set Starting Point\u003cbr\u003etheta = 0 or prior estimate\u003cbr\u003eResponse history = empty\"]\n    B --\u003e C[\"2. Select Next Item\u003cbr\u003eFrom unused items in bank\u003cbr\u003eApply content balancing\u003cbr\u003eApply exposure control\u003cbr\u003eSelect i-star = argmax I_i\"]\n    C --\u003e D[\"3. Administer Item\u003cbr\u003ePresent item i-star to test-taker\u003cbr\u003eRecord response = 0 or 1\u003cbr\u003eAdd i-star to used set U\"]\n    D --\u003e E[\"4. Update Ability Estimate\u003cbr\u003eUpdate response vector u\u003cbr\u003eRecalculate theta via MLE or EAP\u003cbr\u003eSE = 1 divided by sqrt of sum I\"]\n    E --\u003e F{\"5. Termination Criterion Met?\u003cbr\u003eSE less than epsilon OR n gte N_max\"}\n    F --\u003e|No| C\n    F --\u003e|Yes| G[\"6. Report Final Score\u003cbr\u003eReport theta and SE\u003cbr\u003eApply score transformation\"]\n    G --\u003e H([End])\n```\n\n---\n\n## Part 4: IRT Models Used in CAT\n\nCAT is built on Item Response Theory. The three most common models are [10]:\n\n### 1PL — Rasch Model\nOnly difficulty $b$ varies between items; discrimination is fixed at $a = 1$ and guessing $c = 0$:\n\n$$P_i(\\theta) = \\frac{1}{1 + e^{-(\\theta - b_i)}}$$\n\n### 2PL Model\nBoth difficulty $b$ and discrimination $a$ vary; no guessing ($c = 0$):\n\n$$P_i(\\theta) = \\frac{1}{1 + e^{-a_i(\\theta - b_i)}}$$\n\n### 3PL Model (most common in high-stakes CAT)\nAll three parameters vary — discrimination $a_i$, difficulty $b_i$, and guessing $c_i$:\n\n$$P_i(\\theta) = c_i + \\frac{1 - c_i}{1 + e^{-a_i(\\theta - b_i)}}$$\n\nWhere:\n- $\\theta \\in (-\\infty, +\\infty)$, typically $[-3, 3]$ — test-taker ability\n- $a_i \u003e 0$ — item discrimination (steepness of the curve)\n- $b_i \\in [-3, 3]$ — item difficulty (location of the curve)\n- $c_i \\in [0, 1]$ — pseudo-guessing parameter (lower asymptote)\n\n---\n\n## Part 5: Historical Origins\n\nThe adaptive testing concept is not new. Its origins can be traced to Alfred Binet's IQ test (1905), which used an adaptive procedure: items were organized by age-difficulty level, and the examiner would probe upward or downward based on each child's responses [1].\n\nThe key historical milestones are [1, 8]:\n\n| Year | Event |\n|---|---|\n| 1905 | Binet's adaptive IQ test — first adaptive testing procedure |\n| 1952 | Lord observes that ability scores are test-independent (unlike observed scores) |\n| 1960 | Rasch describes the one-parameter logistic IRT model |\n| 1973 | Weiss proposes the \"stradaptive\" computer-delivered test |\n| 1980 | Lord publishes the foundational IRT textbook |\n| 1994 | NCLEX (nursing licensure exam) adopts CAT — first large-scale operational use |\n| 2007 | National Registry of Emergency Medical Technicians adopts CAT |\n\n---\n\n## Part 6: Practical Example — How CAT Selects Items\n\nThe following example illustrates the item selection process step by step [3]:\n\n\u003e Suppose we have five items in the bank and the starting theta is $\\hat{\\theta}_0 = 0.0$.\n\n**Round 1:**\n- Compute $I_i(0.0)$ for all items → **Item 4** has highest information\n- Test-taker answers **incorrectly** ($u_1 = 0$)\n- Run MLE/EAP → new estimate: $\\hat{\\theta}_1 = -2.0$\n- Check termination: $SE(\\hat{\\theta}_1)$ too large, continue\n\n**Round 2:**\n- Compute $I_i(-2.0)$ for remaining items → **Item 2** has highest information\n- Test-taker answers **correctly** ($u_2 = 1$)\n- Update theta → $\\hat{\\theta}_2 = -0.8$\n- Check termination: not done yet\n\n**Round 3:**\n- Item 2 and Item 4 already used ($\\mathcal{U} = \\{2, 4\\}$)\n- Next best available at $\\hat{\\theta}_2 = -0.8$ → **Item 1**\n- Test-taker answers correctly ($u_3 = 1$, item is easy)\n- Update theta → $\\hat{\\theta}_3 = -0.2$\n- Continue...\n\nThis demonstrates how CAT **homes in** on the test-taker's true ability through successive approximation.\n\n---\n\n## Part 7: Advantages and Challenges\n\n### Advantages \n\n| Advantage | Detail |\n|---|---|\n| **Efficiency** | Typically 50% fewer items needed for same precision |\n| **Equal precision** | $SE(\\hat{\\theta})$ is controlled uniformly across all ability levels |\n| **Fairness** | Each test-taker gets items appropriate to their level |\n| **Immediate results** | Scoring is done in real-time |\n| **Security** | Unique item sets make sharing answers less useful |\n| **Adaptive length** | Test ends when $SE(\\hat{\\theta}) \u003c \\epsilon$ |\n\n[2, 4, 6]\n\n### Challenges \n\n| Challenge | Detail |\n|---|---|\n| **Item bank development** | Requires large pilot studies to calibrate $a$, $b$, $c$ parameters |\n| **Cost** | Expensive to build and maintain the platform |\n| **Test-taker experience** | Test-takers may feel discouraged if items seem consistently hard |\n| **Content balance** | Purely statistical selection (argmax $I_i(\\hat{\\theta})$) may neglect content coverage |\n| **Item exposure** | Items with high $I_i(\\theta)$ at common $\\theta$ values are overused |\n| **Unidimensionality** | IRT assumes a single latent trait $\\theta$; multidimensional constructs are harder |\n\n[2, 4, 5]\n\n\u003e [note]:\n\u003e\n\u003e \"A trade-off must be made between the psychological experiences of test-takers and measurement efficiency.\" [2]\n\n---\n\n## Part 8: Real-World Applications\n\nCAT is used in many high-stakes assessments worldwide [1, 4]:\n\n| Exam | Domain | CAT Since |\n|---|---|---|\n| **NCLEX-RN / NCLEX-PN** | Nursing licensure (USA) | 1994 |\n| **GRE General Test** | Graduate school admissions | 1994 |\n| **GMAT** | Business school admissions | 1997 |\n| **NREMT** | Emergency Medical Technicians | 2007 |\n| **TOEFL iBT** | English language proficiency | adaptive sections |\n| **ASVAB-CAT** | US Military enlistment | adaptive version |\n\n---\n\n## Summary\n\nThe CAT process can be summarized in three phases:\n\n**Before the test (Development):**\n1. Determine feasibility\n2. Write and pilot items\n3. Calibrate IRT parameters ($a_i$, $b_i$, $c_i$)\n4. Build and validate the item bank\n5. Define all five algorithm components\n\n**During the test (Runtime loop):**\n1. Set starting point $\\hat{\\theta}_0$\n2. Select $i^* = \\arg\\max\\ I_i(\\hat{\\theta})$ from unused items\n3. Administer item, record response $u \\in \\{0, 1\\}$\n4. Update $\\hat{\\theta}$ using MLE or EAP; compute $SE(\\hat{\\theta})$\n5. Check stopping rule → repeat or stop\n\n**After the test (Reporting):**\n1. Report final $\\hat{\\theta}$ and $SE(\\hat{\\theta})$\n2. Apply score transformation if needed\n3. Log responses for item bank maintenance\n\n---\n\n## References\n\n[1] Weiss, D. J. (n.d.). *Introduction to CAT*. International Association for Computerized Adaptive Testing (IACAT). https://iacat.org/introduction-to-cat/\n\n[2] Kim, J., \u0026 Chung, H. (2017). The impacts of computer adaptive testing from a variety of perspectives. *PMC*. https://pmc.ncbi.nlm.nih.gov/articles/PMC5549015/\n\n[3] Assessment Systems Corporation. (2025). *Computerized Adaptive Testing (CAT): Software, Meaning, Example*. https://assess.com/computerized-adaptive-testing/\n\n[4] Seo, D. G. (2017). Overview and current management of computerized adaptive testing in licensing/certification examinations. *Journal of Educational Evaluation for Health Professions, 14*, 17. https://doi.org/10.3352/jeehp.2017.14.17\n\n[5] Kim, D., \u0026 Chung, H. (2018). Components of the item selection algorithm in computerized adaptive testing. *Journal of Educational Evaluation for Health Professions*. https://pmc.ncbi.nlm.nih.gov/articles/PMC5968224/\n\n[6] Cogn-IQ. (2026). *Adaptive Testing in Psychometrics — Definition \u0026 Examples*. https://www.cogn-iq.org/learn/theory/adaptive-testing/\n\n[7] UWorld Nursing. (2025). *What Is NCLEX Computerized Adaptive Testing (CAT)?* https://nursing.uworld.com/blog/nclex-computer-adaptive-test/\n\n[8] Janssen, R., \u0026 De Boeck, P. (2010). *Computerized adaptive testing: implementation issues*. arXiv. https://arxiv.org/pdf/1012.0042\n\n[9] Wikipedia contributors. (2026). *Computerized adaptive testing*. Wikipedia. https://en.wikipedia.org/wiki/Computerized_adaptive_testing\n\n[10] Lord, F. M. (1980). *Applications of Item Response Theory to Practical Testing Problems*. Lawrence Erlbaum Associates.\n"])</script><script>self.__next_f.push([1,"13:T26cd,"])</script><script>self.__next_f.push([1,"\n## What is CAT?\n\nComputer Adaptive Testing is a method of administering tests where **the difficulty of each question adapts in real-time based on the test-taker's ability**. Unlike traditional fixed tests where everyone gets the same questions, CAT selects the most informative question for each individual at each step [1, 2].\n\nThe core idea:\n- If you answer correctly → next question is **harder**\n- If you answer incorrectly → next question is **easier**\n- The test **converges** on your true ability with fewer questions than a fixed test\n\n\u003e \"CAT yields a high and equal degree of precision for all candidates, and requires fewer items than a conventional test to reach a given degree of precision.\" — Eggen \u0026 Verschoor (2006) [3]\n\n---\n\n## Core Components\n\n### 1. Item Response Theory (IRT)\n\nIRT is the mathematical foundation of CAT. It models the **probability of a correct response** as a function of the person's ability and the item's properties [4].\n\nThe most common model is the **3-Parameter Logistic (3PL) model**:\n\n$$\nP(\\theta) = c + (1-c) \\cdot \\frac{1}{1 + e^{-a(\\theta - b)}}\n$$\n\nWhere:\n- **θ (theta)** — the person's ability (typically ranges from -3 to +3)\n- **a** — discrimination parameter (how well the item differentiates abilities)\n- **b** — difficulty parameter (the ability level where P = 0.5)\n- **c** — guessing parameter (probability of correct answer by chance)\n\nSimpler models [4]:\n- **1PL (Rasch)** — only difficulty `b`, assumes equal discrimination\n- **2PL** — difficulty `b` + discrimination `a`, no guessing\n- **3PL** — full model with guessing `c`\n\n---\n\n### 2. Item Parameters\n\nEach item in your item bank has parameters that describe its characteristics [4, 5]:\n\n#### Difficulty (b)\n- Ranges typically from **-3 to +3**\n- `b = -2` → very easy item (most people get it right)\n- `b = 0` → medium item (50% chance at average ability)\n- `b = +2` → very hard item (only high ability people get it right)\n\n#### Discrimination (a)\n- Ranges typically from **0 to 3**\n- Higher `a` = better at separating high vs low ability test-takers\n- `a \u003c 0.5` → poor discrimination, item barely helps\n- `a = 1.0` → good discrimination\n- `a \u003e 2.0` → excellent discrimination\n\n#### Guessing (c)\n- Ranges from **0 to 1**\n- For multiple choice with 4 options, `c ≈ 0.25`\n- Accounts for the fact that low-ability test-takers can guess correctly\n\n---\n\n### 3. Item Information Function (IIF)\n\nThe **information** an item provides tells us **how useful it is for estimating ability at a given theta level** [4]:\n\n$$\nI(\\theta) = \\frac{a^2 \\left[P(\\theta) - c\\right]^2}{(1-c)^2 \\cdot P(\\theta) \\cdot (1 - P(\\theta))}\n$$\n\nKey insight:\n- An item provides **maximum information** when its difficulty matches the person's ability (`b ≈ θ`)\n- Items that are too easy or too hard provide little information\n- Higher discrimination `a` = more information overall\n\nThis is why CAT selects items where **difficulty ≈ current theta** — it's the point of maximum information [5].\n\n---\n\n### 4. Theta Estimation\n\nAfter each response, the person's ability estimate is updated. The main methods are [4, 6]:\n\n#### Maximum Likelihood Estimation (MLE)\nFinds the theta that maximizes the likelihood of the observed response pattern:\n\n$$\nL(\\theta) = \\prod P(\\theta)^u \\cdot (1 - P(\\theta))^{1-u}\n$$\n\nWhere `u = 1` if correct, `u = 0` if incorrect.\n\n\u003e **Problem:** MLE is undefined if all answers are correct or all incorrect.\n\n#### Bayesian Estimation (EAP/MAP)\nUses a **prior distribution** (usually normal) combined with the likelihood [6]:\n\n$$\n\\theta_{posterior} = \\int \\theta \\cdot L(\\theta) \\cdot prior(\\theta) \\, d\\theta\n$$\n\n- **EAP (Expected A Posteriori)** — takes the mean of the posterior\n- **MAP (Maximum A Posteriori)** — takes the mode of the posterior\n\nBayesian methods work even with all-correct or all-incorrect patterns, making them preferred for CAT [3, 6].\n\n#### Simple Approximation\n```r\nif correct:   theta = theta + 0.3\nif incorrect: theta = theta - 0.3\n```\n\nThis is a simplified approximation — not true IRT but easy to implement for prototyping.\n\n---\n\n### 5. Item Selection Methods\n\nAt each step, CAT must choose the **next best item**. Common methods [2, 5]:\n\n#### Maximum Information (most common)\nSelect the item that provides maximum information at current theta:\n\n```r\n# Select item with highest information at current theta\nI \u003c- a^2 * P * (1-P)  # simplified 2PL information\nnext_item \u003c- item with max(I)\n```\n\n#### Closest Difficulty (simplified)\nSelect item whose difficulty is closest to current theta:\n\n```r\nitems$diff \u003c- abs(items$difficulty - theta)\nselected \u003c- items[which.min(items$diff), ]\n```\n\nSimple but effective approximation of maximum information.\n\n#### Other Methods\n\n| Method | Description |\n|---|---|\n| **Random from eligible set** | Adds randomness to prevent item overexposure [2] |\n| **Maximum Fisher information** | Full IRT-based calculation [4] |\n| **Kullback-Leibler information** | Information-theoretic approach [5] |\n\n---\n\n### 6. Stopping Rules\n\nCAT stops when one of these conditions is met [3, 7]:\n\n| Rule | Description |\n|---|---|\n| **Fixed length** | Stop after N items (simplest) |\n| **Standard error** | Stop when SE(θ) \u003c threshold (e.g. SE \u003c 0.3) |\n| **Confidence interval** | Stop when CI is narrow enough |\n| **Time limit** | Stop after time expires |\n| **Item bank exhausted** | No more unused items available |\n\nStandard error of theta:\n\n$$\nSE(\\theta) = \\frac{1}{\\sqrt{\\sum I(\\theta)}}\n$$\n\nThe more items answered, the lower the SE and the more precise the estimate.\n\n\u003e For example, Huda et al. (2024) used SE ≤ 0.01 as the stopping criterion in their CAT implementation for student assessment [7].\n\n---\n\n## Full CAT Process Flow\n\n```\n1. START\n   θ₀ = 0 (or prior mean)\n   SE = ∞\n\n2. ITEM SELECTION\n   Find item i* = argmax I(θ_current)\n   from unused items\n\n3. PRESENT ITEM\n   Show question to test-taker\n   Record response u (1=correct, 0=incorrect)\n\n4. THETA UPDATE\n   Update θ using MLE or Bayesian method\n   based on all responses so far\n\n5. STOPPING CHECK\n   If stopping rule met → go to 6\n   Else → go back to 2\n\n6. REPORT\n   Final θ estimate\n   SE(θ)\n   Confidence interval\n```\n\n---\n\n## Why CAT is Better Than Fixed Tests\n\n| Feature | Fixed Test | CAT |\n|---|---|---|\n| Number of items | Same for everyone (e.g. 50) | Fewer needed (e.g. 20–25) [1] |\n| Precision | Same for all ability levels | Highest where it matters [3] |\n| Test experience | Many items too easy or too hard | Most items appropriately challenging [2] |\n| Item exposure | All items used equally | Risk of overexposure [2] |\n| Security | All items known | Items protected by adaptive selection [1] |\n| Test time | Longer | Shorter (30–50% reduction) [1] |\n\n---\n\n## Interpreting Theta (θ)\n\nTheta follows a standard normal distribution. Here's how to interpret the score [4]:\n\n| Theta Range | Interpretation |\n|---|---|\n| θ \u003e 2.0 | Exceptionally high ability |\n| 1.0 \u003c θ ≤ 2.0 | High ability |\n| -1.0 \u003c θ ≤ 1.0 | Average ability |\n| -2.0 \u003c θ ≤ -1.0 | Below average ability |\n| θ ≤ -2.0 | Very low ability |\n\nTheta can also be converted to a more familiar scale:\n\n$$\n\\text{Score} = 500 + (\\theta \\times 100) \\quad \\text{// SAT-like scale (mean=500, SD=100)}\n$$\n\n$$\n\\text{Score} = 100 + (\\theta \\times 15) \\quad \\text{// IQ-like scale (mean=100, SD=15)}\n$$\n\n---\n\n## Summary Table\n\n| Concept | Symbol | What it does |\n|---|---|---|\n| Ability estimate | θ (theta) | Represents person's latent ability [4] |\n| Difficulty | b | Item's difficulty level [4] |\n| Discrimination | a | How well item separates abilities [4] |\n| Guessing | c | Chance of correct answer without knowledge [4] |\n| Item Information | I(θ) | How useful an item is at a given theta [5] |\n| Standard Error | SE(θ) | Precision of the theta estimate [3] |\n| Theta estimation | MLE/EAP | Updates ability after each response [6] |\n| Item selection | argmax I(θ) | Picks most informative next item [2] |\n| Stopping rule | SE \u003c 0.3 or N items | Decides when test is precise enough [3] |\n\n---\n\n## Key Takeaway\n\n\u003e The goal of CAT is always: **estimate theta as accurately as possible using as few items as possible** [1, 3].\n\nCAT achieves this by always asking the question that provides the most information about the person's ability at their current estimated level — making every question count.\n\n---\n\n## References\n\n[1] Davey, T. (2011). *A guide to computer adaptive testing systems*. Council of Chief State School Officers.\n\n[2] van der Linden, W. J., \u0026 Glas, C. A. W. (2022). *Computerized Adaptive Testing: Theory and Practice*. Kluwer Academic Publishers.\n\n[3] Eggen, T. J. H. M., \u0026 Verschoor, A. J. (2006). Overview and current management of computerized adaptive testing in licensing/certification examinations. *PMC*, NCBI. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5676016/\n\n[4] Lord, F. M. (1980). *Applications of Item Response Theory to Practical Testing Problems*. Lawrence Erlbaum Associates / Routledge. https://doi.org/10.4324/9780203056615\n\n[5] De Ayala, R. J. (2009). *The Theory and Practice of Item Response Theory*. New York: The Guilford Press.\n\n[6] Magis, D., \u0026 Barrada, J. R. (2017). Computerized Adaptive Testing with R: Recent Updates of the Package catR. *Journal of Statistical Software, Code Snippets, 76*(1), 1–18. https://doi.org/10.18637/jss.v076.c01\n\n[7] Huda, A., Firdaus, F., Irfan, D., Hendriyani, Y., Almasri, A., \u0026 Sukmawati, M. (2024). Optimizing Educational Assessment: The Practicality of Computer Adaptive Testing (CAT) with an Item Response Theory (IRT) Approach. *JOIV: International Journal on Informatics Visualization, 8*(1), 473–480. https://doi.org/10.62527/joiv.8.1.2217\n\n[8] Magis, D., \u0026 Raiche, G. (2012). Random Generation of Response Patterns under Computerized Adaptive Testing with the R Package catR. *Journal of Statistical Software, 48*(8), 1–31. https://doi.org/10.18637/jss.v048.i08\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"type\":\"$undefined\",\"children\":[\"$\",\"$a\",null,{\"children\":[\"$\",\"$L11\",null,{\"posts\":[{\"slug\":\"cat-procedure\",\"meta\":{\"title\":\"The Actual Procedure and Process of Computer Adaptive Testing (CAT)\",\"date\":\"2026-05-05\",\"description\":\"omputerized Adaptive Testing (CAT) is a form of computer-based testing that adapts in real-time to each test-taker's ability level\",\"author\":\"irufano\",\"tags\":[\"AI\",\"CAT\",\"Adaptive Test\"],\"image\":\"https://www.assessmentworkshop.com/wp-content/uploads/2022/04/CAT-Infographic.png\",\"category\":\"CAT\"},\"rawContent\":\"$12\",\"readingTime\":\"15 min read\"},{\"slug\":\"cat-theory\",\"meta\":{\"title\":\"Computer Adaptive Testing (CAT) Theory\",\"date\":\"2026-05-05\",\"description\":\"Computer Adaptive Testing is a method of administering tests where **the difficulty of each question adapts in real-time based on the test-taker's ability**.\",\"author\":\"irufano\",\"tags\":[\"AI\",\"CAT\",\"Adaptive Test\"],\"image\":\"https://www.assessmentworkshop.com/wp-content/uploads/2022/04/CAT-Infographic.png\",\"category\":\"CAT\"},\"rawContent\":\"$13\",\"readingTime\":\"9 min read\"}],\"tag\":\"CAT\"}]}]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"b:null\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"title\",\"0\",{\"children\":\"Irufano Dev - Developer Portal\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A tech docs, insights about the software development and also provides several tools for anyone who need it\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Irufano Dev - Developer Portal\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":
