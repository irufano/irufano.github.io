/static/chunks/156cqvtv.tz0c.js\"],\"default\"]\n15:T591b,"])</script><script>self.__next_f.push([1,"\n\u003e **Abstract:** Multidimensional Computer Adaptive Testing (MCAT) extends the classical unidimensional CAT framework to simultaneously estimate multiple latent traits. This document details the theoretical foundations, algorithmic procedures, item selection strategies, ability estimation methods, and stopping rules that govern the MCAT process, with reference to seminal and contemporary literature.\n\n---\n\n## 1. Theoretical Background\n\nMultidimensional Computer Adaptive Testing (MCAT) is a psychometric framework that generalizes unidimensional CAT (UCAT) to settings where examinees possess a **vector of latent traits** rather than a single ability [1][2]. The fundamental motivation is that most cognitive, psychological, and educational constructs are inherently multifaceted; a single scalar cannot adequately characterize proficiency in, for example, mathematics (algebra, geometry, statistics) or language ability (reading, grammar, vocabulary) [3].\n\nMCAT was formalized extensively by Reckase [4] through the development of **Multidimensional Item Response Theory (MIRT)**, which provides the probabilistic measurement model underlying all MCAT procedures. The adaptive component ensures that items administered to an examinee are optimally informative given the current estimate of the **ability vector** $\\boldsymbol{\\theta}$ [1][5].\n\n---\n\n## 2. Item Response Theory in Multiple Dimensions\n\n### 2.1 The Latent Trait Vector\n\nIn MCAT, each examinee is characterized by a $K$-dimensional ability vector:\n\n$$\\boldsymbol{\\theta} = (\\theta_1, \\theta_2, \\ldots, \\theta_K)^{\\top} \\in \\mathbb{R}^K$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\boldsymbol{\\theta}$ | Latent trait (ability) vector |\n| $\\theta_k$ | Latent ability on dimension $k$ |\n| $K$ | Total number of dimensions (latent traits) |\n\n### 2.2 Multidimensional Item Response Model\n\nThe most widely used model in MCAT is the **Multidimensional Two-Parameter Logistic (M2PL)** model [4][6]:\n\n$$P(X_{ij} = 1 \\mid \\boldsymbol{\\theta}_j, \\mathbf{a}_i, d_i) = \\frac{\\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}{1 + \\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $X_{ij}$ | Binary response of examinee $j$ to item $i$ (1 = correct, 0 = incorrect) |\n| $\\boldsymbol{\\theta}_j$ | Ability vector of examinee $j$ |\n| $\\mathbf{a}_i = (a_{i1}, a_{i2}, \\ldots, a_{iK})^{\\top}$ | Discrimination parameter vector for item $i$ on each dimension |\n| $d_i$ | Scalar intercept (difficulty) parameter for item $i$ |\n| $\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j$ | Dot product: $\\sum_{k=1}^{K} a_{ik} \\theta_{jk}$ |\n\nFor the **Multidimensional Three-Parameter Logistic (M3PL)** model with guessing [4][7]:\n\n$$P(X_{ij} = 1 \\mid \\boldsymbol{\\theta}_j) = c_i + (1 - c_i) \\cdot \\frac{\\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}{1 + \\exp(\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta}_j + d_i)}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $c_i$ | Pseudo-guessing parameter for item $i$ ($0 \\leq c_i \u003c 1$) |\n\n### 2.3 Item Information in Multiple Dimensions\n\nThe **Fisher Information Matrix (FIM)** for item $i$ given ability $\\boldsymbol{\\theta}$ is a $K \\times K$ matrix [1][8]:\n\n$$\\mathbf{I}_i(\\boldsymbol{\\theta}) = \\frac{[P'_i(\\boldsymbol{\\theta})]^2}{P_i(\\boldsymbol{\\theta})\\, Q_i(\\boldsymbol{\\theta})} \\cdot \\mathbf{a}_i \\mathbf{a}_i^{\\top}$$\n\nwhere:\n\n$$P'_i(\\boldsymbol{\\theta}) = \\frac{\\partial P_i(\\boldsymbol{\\theta})}{\\partial (\\mathbf{a}_i^{\\top} \\boldsymbol{\\theta})} = P_i(\\boldsymbol{\\theta})\\, Q_i(\\boldsymbol{\\theta})$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\mathbf{I}_i(\\boldsymbol{\\theta})$ | $K \\times K$ Fisher Information Matrix for item $i$ |\n| $P_i(\\boldsymbol{\\theta})$ | Probability of correct response to item $i$ |\n| $Q_i(\\boldsymbol{\\theta}) = 1 - P_i(\\boldsymbol{\\theta})$ | Probability of incorrect response |\n| $P'_i(\\boldsymbol{\\theta})$ | Derivative of $P_i$ with respect to the linear predictor |\n| $\\mathbf{a}_i \\mathbf{a}_i^{\\top}$ | Outer product of the discrimination vector (rank-1 matrix) |\n\nThe **cumulative FIM** after administering $n$ items is:\n\n$$\\mathbf{I}_{(n)}(\\boldsymbol{\\theta}) = \\sum_{i=1}^{n} \\mathbf{I}_i(\\boldsymbol{\\theta})$$\n\n---\n\n## 3. The MCAT Process Overview\n\nThe following diagram illustrates the complete MCAT procedure from initialization to termination:\n\n```mermaid\nflowchart TD\n    A([Start: Examinee Begins Test]) --\u003e B[Initialize Ability Estimate\\n θ̂ = θ₀, e.g., 0-vector]\n    B --\u003e C[Select Starting Items\\nfrom Item Bank]\n    C --\u003e D{Item Bank\\nAvailable?}\n    D -- No --\u003e Z([Error: Insufficient Items])\n    D -- Yes --\u003e E[Select Optimal Item\\nusing Selection Criterion]\n    E --\u003e F[Administer Item to Examinee]\n    F --\u003e G[\"Record Response\\nXᵢ ∈ {0, 1}\"]\n    G --\u003e H[Update Ability Estimate\\nθ̂ via MLE / MAP / EAP]\n    H --\u003e I[Update Fisher\\nInformation Matrix I_n]\n    I --\u003e J{Stopping Rule\\nSatisfied?}\n    J -- No --\u003e K{Exposure \u0026\\nContent Constraints Met?}\n    K -- Yes --\u003e E\n    K -- No --\u003e L[Apply Constrained\\nItem Selection]\n    L --\u003e E\n    J -- Yes --\u003e M[Final Ability Estimate\\nθ̂_final with SE]\n    M --\u003e N[Generate Score Report]\n    N --\u003e O([End: Test Complete])\n\n    style A fill:#2d6a4f,color:#fff\n    style O fill:#2d6a4f,color:#fff\n    style Z fill:#b5192b,color:#fff\n    style J fill:#1d3557,color:#fff\n    style K fill:#1d3557,color:#fff\n```\n\n---\n\n## 4. Step-by-Step Procedure\n\n### Step 1: Initialization\n\nBefore any item is administered, the system establishes:\n\n- **Prior ability distribution:** $\\boldsymbol{\\theta}_0 \\sim \\mathcal{N}(\\boldsymbol{\\mu}_0, \\boldsymbol{\\Sigma}_0)$, typically $\\boldsymbol{\\mu}_0 = \\mathbf{0}$, $\\boldsymbol{\\Sigma}_0 = \\mathbf{I}_K$ (identity matrix) [2][9]\n- **Item bank:** A calibrated pool $\\mathcal{B}$ of $M$ items with known MIRT parameters $\\{\\mathbf{a}_i, d_i, c_i\\}$\n- **Starting ability estimate:** $\\hat{\\boldsymbol{\\theta}}^{(0)} = \\boldsymbol{\\mu}_0$\n\n### Step 2: Item Selection\n\nAt step $n$, the item $i^*$ is selected from the remaining bank $\\mathcal{B}_n = \\mathcal{B} \\setminus \\{i_1, \\ldots, i_{n-1}\\}$ using a selection criterion $\\mathcal{S}$:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\mathcal{S}\\left(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}}^{(n-1)})\\right)$$\n\nCommon criteria are detailed in [Section 6](#6-item-selection-criteria).\n\n### Step 3: Item Administration\n\nItem $i^*$ is presented to the examinee who provides response $x_{i^*} \\in \\{0, 1\\}$ (for dichotomous items) or $x_{i^*} \\in \\{0, 1, \\ldots, m_i\\}$ (polytomous items).\n\n### Step 4: Ability Re-estimation\n\nThe ability vector is updated using accumulated response vector $\\mathbf{x}^{(n)} = (x_{i_1}, \\ldots, x_{i_n})^{\\top}$.\n\n**Log-likelihood function** [1][6]:\n\n$$\\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}) = \\sum_{t=1}^{n} \\left[ x_{i_t} \\ln P_{i_t}(\\boldsymbol{\\theta}) + (1 - x_{i_t}) \\ln Q_{i_t}(\\boldsymbol{\\theta}) \\right]$$\n\nDetails of estimation methods are in [Section 5](#5-ability-estimation-methods).\n\n### Step 5: Update Information Matrix\n\n$$\\mathbf{I}_{(n)}(\\hat{\\boldsymbol{\\theta}}^{(n)}) = \\sum_{t=1}^{n} \\mathbf{I}_{i_t}(\\hat{\\boldsymbol{\\theta}}^{(n)})$$\n\n### Step 6: Check Stopping Rule\n\nEvaluate whether stopping criteria are satisfied (see [Section 7](#7-stopping-rules)). If yes → proceed to scoring; if no → return to Step 2.\n\n### Step 7: Score Reporting\n\nProvide the final estimate $\\hat{\\boldsymbol{\\theta}}_{\\text{final}}$ along with the **standard error vector**:\n\n$$\\text{SE}(\\hat{\\boldsymbol{\\theta}}) = \\sqrt{\\text{diag}\\left[\\mathbf{I}_{(n)}^{-1}(\\hat{\\boldsymbol{\\theta}})\\right]}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\text{SE}(\\hat{\\boldsymbol{\\theta}})$ | Vector of standard errors for each dimension estimate |\n| $\\text{diag}[\\cdot]$ | Diagonal extraction operator |\n| $\\mathbf{I}_{(n)}^{-1}$ | Inverse of the cumulative FIM (posterior covariance approximation) |\n\n---\n\n## 5. Ability Estimation Methods\n\n### 5.1 Maximum Likelihood Estimation (MLE)\n\nMLE finds $\\hat{\\boldsymbol{\\theta}}$ by maximizing the log-likelihood [1][10]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{MLE}} = \\underset{\\boldsymbol{\\theta}}{\\arg\\max} \\; \\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)})$$\n\nThe **score function** (gradient):\n\n$$\\mathbf{s}(\\boldsymbol{\\theta}) = \\nabla_{\\boldsymbol{\\theta}} \\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}) = \\sum_{t=1}^{n} \\frac{x_{i_t} - P_{i_t}(\\boldsymbol{\\theta})}{P_{i_t}(\\boldsymbol{\\theta}) Q_{i_t}(\\boldsymbol{\\theta})} \\cdot P'_{i_t}(\\boldsymbol{\\theta}) \\cdot \\mathbf{a}_{i_t}$$\n\nSolved via Newton-Raphson iteration [10]:\n\n$$\\hat{\\boldsymbol{\\theta}}^{(r+1)} = \\hat{\\boldsymbol{\\theta}}^{(r)} + \\left[\\mathbf{I}_{(n)}(\\hat{\\boldsymbol{\\theta}}^{(r)})\\right]^{-1} \\mathbf{s}(\\hat{\\boldsymbol{\\theta}}^{(r)})$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $r$ | Iteration index in Newton-Raphson |\n| $\\mathbf{s}(\\boldsymbol{\\theta})$ | Score function (gradient of log-likelihood) |\n\n\u003e ⚠️ **Limitation:** MLE is undefined when all responses are correct or all incorrect (degenerate response patterns) [2].\n\n### 5.2 Maximum A Posteriori (MAP) Estimation\n\nMAP incorporates a prior distribution $g(\\boldsymbol{\\theta})$ (typically multivariate normal) [2][9]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{MAP}} = \\underset{\\boldsymbol{\\theta}}{\\arg\\max} \\left[ \\ell(\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}) + \\ln g(\\boldsymbol{\\theta}) \\right]$$\n\nWith a multivariate normal prior $\\boldsymbol{\\theta} \\sim \\mathcal{N}(\\boldsymbol{\\mu}_0, \\boldsymbol{\\Sigma}_0)$:\n\n$$\\ln g(\\boldsymbol{\\theta}) = -\\frac{1}{2}(\\boldsymbol{\\theta} - \\boldsymbol{\\mu}_0)^{\\top} \\boldsymbol{\\Sigma}_0^{-1} (\\boldsymbol{\\theta} - \\boldsymbol{\\mu}_0) + \\text{const}$$\n\nThe modified Newton-Raphson step becomes:\n\n$$\\hat{\\boldsymbol{\\theta}}^{(r+1)}_{\\text{MAP}} = \\hat{\\boldsymbol{\\theta}}^{(r)} + \\left[\\mathbf{I}_{(n)}(\\hat{\\boldsymbol{\\theta}}^{(r)}) + \\boldsymbol{\\Sigma}_0^{-1}\\right]^{-1} \\left[\\mathbf{s}(\\hat{\\boldsymbol{\\theta}}^{(r)}) - \\boldsymbol{\\Sigma}_0^{-1}(\\hat{\\boldsymbol{\\theta}}^{(r)} - \\boldsymbol{\\mu}_0)\\right]$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $g(\\boldsymbol{\\theta})$ | Prior density of ability vector |\n| $\\boldsymbol{\\mu}_0$ | Prior mean vector (often $\\mathbf{0}$) |\n| $\\boldsymbol{\\Sigma}_0$ | Prior covariance matrix |\n| $\\boldsymbol{\\Sigma}_0^{-1}$ | Precision matrix of the prior |\n\n### 5.3 Expected A Posteriori (EAP) Estimation\n\nEAP computes the **posterior mean** [9][11]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{EAP}} = \\mathbb{E}[\\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n)}] = \\frac{\\int \\boldsymbol{\\theta} \\cdot L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}) \\cdot g(\\boldsymbol{\\theta}) \\, d\\boldsymbol{\\theta}}{\\int L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}) \\cdot g(\\boldsymbol{\\theta}) \\, d\\boldsymbol{\\theta}}$$\n\nwhere the likelihood:\n\n$$L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}) = \\prod_{t=1}^{n} P_{i_t}(\\boldsymbol{\\theta})^{x_{i_t}} Q_{i_t}(\\boldsymbol{\\theta})^{1 - x_{i_t}}$$\n\nIn practice, EAP is computed via **Gauss-Hermite quadrature** or **Monte Carlo integration** over a grid of quadrature points $\\{\\boldsymbol{\\theta}^{(q)}, w^{(q)}\\}$ [9]:\n\n$$\\hat{\\boldsymbol{\\theta}}_{\\text{EAP}} \\approx \\frac{\\sum_{q} \\boldsymbol{\\theta}^{(q)} \\cdot L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}^{(q)}) \\cdot g(\\boldsymbol{\\theta}^{(q)}) \\cdot w^{(q)}}{\\sum_{q} L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta}^{(q)}) \\cdot g(\\boldsymbol{\\theta}^{(q)}) \\cdot w^{(q)}}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\boldsymbol{\\theta}^{(q)}$ | $q$-th quadrature point in the $K$-dimensional grid |\n| $w^{(q)}$ | Quadrature weight for point $q$ |\n| $L(\\mathbf{x}^{(n)} \\mid \\boldsymbol{\\theta})$ | Likelihood of observed responses given $\\boldsymbol{\\theta}$ |\n\n---\n\n## 6. Item Selection Criteria\n\n### 6.1 Maximum Determinant (D-optimality)\n\nSelect the item that maximizes the determinant of the updated FIM [1][8][12]:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\det\\left[\\mathbf{I}_{(n-1)}(\\hat{\\boldsymbol{\\theta}}) + \\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})\\right]$$\n\n**Interpretation:** Maximizes the volume of the confidence ellipsoid's reciprocal — reduces overall estimation uncertainty across all dimensions simultaneously.\n\n### 6.2 Minimum Trace of Posterior Covariance (T-optimality / A-optimality)\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\min} \\; \\text{tr}\\left[\\left(\\mathbf{I}_{(n-1)}(\\hat{\\boldsymbol{\\theta}}) + \\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})\\right)^{-1}\\right]$$\n\n**Interpretation:** Minimizes the sum of posterior variances across all $K$ dimensions [5][13].\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\text{tr}[\\cdot]$ | Matrix trace operator (sum of diagonal elements) |\n| $\\det[\\cdot]$ | Matrix determinant |\n\n### 6.3 Kullback-Leibler Information (KL-criterion)\n\nMaximizes the expected Kullback-Leibler divergence between item response distributions at the current estimate and neighboring ability values [14]:\n\n$$\\text{KL}_i(\\hat{\\boldsymbol{\\theta}}) = \\int_{\\mathcal{V}} \\sum_{x=0}^{1} P(X_i = x \\mid \\hat{\\boldsymbol{\\theta}}) \\ln \\frac{P(X_i = x \\mid \\hat{\\boldsymbol{\\theta}})}{P(X_i = x \\mid \\boldsymbol{\\theta})} \\, d\\boldsymbol{\\theta}$$\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\text{KL}_i(\\hat{\\boldsymbol{\\theta}})$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\mathcal{V}$ | Neighborhood region around $\\hat{\\boldsymbol{\\theta}}$ |\n| $\\text{KL}_i(\\hat{\\boldsymbol{\\theta}})$ | KL information for item $i$ at current ability estimate |\n\n### 6.4 Mutual Information Criterion\n\nSelects items that maximize the mutual information between the item response and the ability vector [15]:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\mathbb{I}(X_i ; \\boldsymbol{\\theta} \\mid \\mathbf{x}^{(n-1)})$$\n\n### Summary Comparison\n\n```mermaid\ngraph LR\n    A[Item Selection Criteria] --\u003e B[D-optimality\\n det of FIM]\n    A --\u003e C[A-optimality\\n trace of FIM⁻¹]\n    A --\u003e D[KL-criterion\\n information gain]\n    A --\u003e E[Mutual Information\\n Bayesian criterion]\n    B --\u003e F[Best for joint\\n precision]\n    C --\u003e G[Best for average\\n dimension precision]\n    D --\u003e H[Best for local\\n discrimination]\n    E --\u003e I[Best for fully\\n Bayesian settings]\n```\n\n---\n\n## 7. Stopping Rules\n\n### 7.1 Fixed Test Length\n\nThe simplest rule: terminate after exactly $N_{\\max}$ items [1]:\n\n$$\\text{Stop if } n = N_{\\max}$$\n\n### 7.2 Standard Error Threshold\n\nTerminate when the standard error for **all** dimensions falls below a threshold $\\epsilon$ [2][5]:\n\n$$\\text{Stop if } \\max_{k \\in \\{1,\\ldots,K\\}} \\text{SE}(\\hat{\\theta}_k) \\leq \\epsilon$$\n\nOr alternatively for the joint criterion using the posterior covariance matrix:\n\n$$\\text{Stop if } \\text{tr}\\left[\\mathbf{I}_{(n)}^{-1}(\\hat{\\boldsymbol{\\theta}})\\right] \\leq \\epsilon^2_{\\text{joint}}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\epsilon$ | Standard error threshold (e.g., 0.30 on the logit scale) |\n| $\\epsilon^2_{\\text{joint}}$ | Joint variance threshold for all dimensions |\n\n### 7.3 Change in Ability Estimate\n\nTerminate when successive ability estimates converge [16]:\n\n$$\\text{Stop if } \\left\\| \\hat{\\boldsymbol{\\theta}}^{(n)} - \\hat{\\boldsymbol{\\theta}}^{(n-1)} \\right\\|_2 \\leq \\delta$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\|\\cdot\\|_2$ | Euclidean (L2) norm |\n| $\\delta$ | Convergence threshold (e.g., 0.01) |\n\n### 7.4 Minimum-Maximum Length Rule (Hybrid)\n\nCombines fixed and SE-based rules for practical testing [2][5]:\n\n$$\\text{Stop if } n \\geq N_{\\min} \\text{ AND } \\left(\\max_k \\text{SE}(\\hat{\\theta}_k) \\leq \\epsilon \\text{ OR } n = N_{\\max}\\right)$$\n\n```mermaid\nflowchart LR\n    A[After each item n] --\u003e B{n ≥ N_min?}\n    B -- No --\u003e F[Continue]\n    B -- Yes --\u003e C{SE ≤ ε\\nfor all k?}\n    C -- Yes --\u003e D([Stop: Precision Met])\n    C -- No --\u003e E{n = N_max?}\n    E -- Yes --\u003e G([Stop: Max Length])\n    E -- No --\u003e F\n```\n\n---\n\n## 8. Item Exposure Control\n\nUncontrolled item selection leads to overexposure of highly informative items, compromising item security. Several methods address this [17][18]:\n\n### 8.1 Sympson-Hetter Method (Randomization)\n\nEach item $i$ is selected with probability $r_i$, where $r_i$ is tuned so that the exposure rate $\\varrho_i \\leq \\varrho_{\\max}$ [17]:\n\n$$r_i = \\min\\left(1, \\frac{\\varrho_{\\max}}{\\varrho_i^{*}}\\right)$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $\\varrho_i$ | Observed exposure rate of item $i$ |\n| $\\varrho_{\\max}$ | Maximum allowable exposure rate (e.g., 0.20) |\n| $\\varrho_i^{*}$ | Unconditional selection probability of item $i$ |\n| $r_i$ | Randomization parameter for item $i$ |\n\n### 8.2 Maximum Priority Index (MPI)\n\nUses a priority index $\\text{PI}_i$ combining information and exposure [18]:\n\n$$\\text{PI}_i = w_1 \\cdot \\mathcal{S}(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})) - w_2 \\cdot \\varrho_i$$\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n}{\\arg\\max} \\; \\text{PI}_i$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $w_1, w_2$ | Weights balancing information gain vs. exposure penalization |\n| $\\mathcal{S}(\\cdot)$ | Item selection criterion value (e.g., determinant) |\n\n---\n\n## 9. Content Balancing\n\nReal-world tests require that items cover specified content areas $\\mathcal{C} = \\{c_1, c_2, \\ldots, c_J\\}$ proportionally [19]. The **constrained CAT** problem is:\n\n$$i^* = \\underset{i \\in \\mathcal{B}_n \\cap \\mathcal{C}_j^{\\text{eligible}}}{\\arg\\max} \\; \\mathcal{S}\\left(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}})\\right)$$\n\nwhere $\\mathcal{C}_j^{\\text{eligible}}$ is the set of items from content area $c_j$ that can still be administered to meet the target distribution $\\boldsymbol{\\pi} = (\\pi_1, \\ldots, \\pi_J)^{\\top}$ [19][20].\n\nThe **Shadow Test** approach [20] solves a 0-1 integer programming problem at each step to select a full-length \"shadow test\" that satisfies all constraints, then administers only the optimal next item from it:\n\n$$\\text{Maximize} \\quad \\sum_{i \\in \\mathcal{B}} s_i \\cdot \\mathcal{S}(\\mathbf{I}_i(\\hat{\\boldsymbol{\\theta}}))$$\n$$\\text{subject to} \\quad \\sum_{i \\in \\mathcal{C}_j} s_i = n_j, \\quad j = 1, \\ldots, J$$\n$$s_i \\in \\{0, 1\\}, \\quad \\sum_{i} s_i = N_{\\max}$$\n\n**Variable Notes:**\n| Symbol | Description |\n|--------|-------------|\n| $s_i$ | Binary decision variable (1 if item $i$ included in shadow test) |\n| $n_j$ | Required number of items from content area $j$ |\n| $\\pi_j$ | Target proportion for content area $j$ |\n\n---\n\n## 10. Comparison: Unidimensional vs. Multidimensional CAT\n\n| Feature | Unidimensional CAT | Multidimensional CAT |\n|---------|-------------------|---------------------|\n| **Latent space** | Scalar $\\theta \\in \\mathbb{R}$ | Vector $\\boldsymbol{\\theta} \\in \\mathbb{R}^K$ |\n| **Item information** | Scalar $I_i(\\theta)$ | Matrix $\\mathbf{I}_i(\\boldsymbol{\\theta}) \\in \\mathbb{R}^{K \\times K}$ |\n| **Estimation** | MLE/MAP (1D optimization) | MLE/MAP (K-D optimization) |\n| **Item selection** | Maximize $I_i(\\hat{\\theta})$ | Maximize $\\det / \\text{tr}^{-1}$ of FIM |\n| **Stopping rule** | $\\text{SE}(\\hat{\\theta}) \\leq \\epsilon$ | $\\max_k \\text{SE}(\\hat{\\theta}_k) \\leq \\epsilon$ |\n| **Computational cost** | Low | Higher (matrix operations) |\n| **Score report** | Single score + SE | Score profile + SE vector |\n| **Between-dimension correlation** | Not applicable | $\\text{Corr}(\\theta_j, \\theta_k)$ estimated |\n\n---\n\n## References\n\n[1] Segall, D. O. (1996). Multidimensional adaptive testing. *Psychometrika*, 61(2), 331–354.\n\n[2] Reckase, M. D., \u0026 Segall, D. O. (2009). Multidimensional adaptive testing. In W. J. van der Linden \u0026 C. A. W. Glas (Eds.), *Elements of Adaptive Testing* (pp. 203–217). Springer.\n\n[3] van der Linden, W. J., \u0026 Hambleton, R. K. (Eds.). (1997). *Handbook of Modern Item Response Theory*. Springer.\n\n[4] Reckase, M. D. (2009). *Multidimensional Item Response Theory*. Springer.\n\n[5] Mulder, J., \u0026 van der Linden, W. J. (2009). Multidimensional adaptive testing with Kullback-Leibler information item selection. In W. J. van der Linden \u0026 C. A. W. Glas (Eds.), *Elements of Adaptive Testing* (pp. 77–101). Springer.\n\n[6] McKinley, R. L., \u0026 Reckase, M. D. (1983). An extension of the two-parameter logistic model to the multidimensional latent space. *ETS Research Report*. Educational Testing Service.\n\n[7] Reckase, M. D. (1985). The difficulty of test items that measure more than one ability. *Applied Psychological Measurement*, 9(4), 401–412.\n\n[8] Berger, M. P. F. (1992). Sequential sampling designs for the two-parameter item response theory model. *Psychometrika*, 57(4), 521–538.\n\n[9] Bock, R. D., \u0026 Mislevy, R. J. (1982). Adaptive EAP estimation of ability in a microcomputer environment. *Applied Psychological Measurement*, 6(4), 431–444.\n\n[10] Lord, F. M. (1980). *Applications of Item Response Theory to Practical Testing Problems*. Lawrence Erlbaum.\n\n[11] Mislevy, R. J. (1986). Bayes modal estimation in item response models. *Psychometrika*, 51(2), 177–195.\n\n[12] Silvey, S. D. (1980). *Optimal Design*. Chapman and Hall.\n\n[13] van der Linden, W. J. (1999). Multidimensional adaptive testing with a minimum error-variance criterion. *Journal of Educational and Behavioral Statistics*, 24(4), 398–412.\n\n[14] Chang, H.-H., \u0026 Ying, Z. (1996). A global information approach to computerized adaptive testing. *Applied Psychological Measurement*, 20(3), 213–229.\n\n[15] Cover, T. M., \u0026 Thomas, J. A. (2006). *Elements of Information Theory* (2nd ed.). Wiley.\n\n[16] Weiss, D. J. (1982). Improving measurement quality and efficiency with adaptive testing. *Applied Psychological Measurement*, 6(4), 473–492.\n\n[17] Sympson, J. B., \u0026 Hetter, R. D. (1985). *Controlling item-exposure rates in computerized adaptive testing*. Proceedings of the 27th Annual Meeting of the Military Testing Association.\n\n[18] Leung, C. K., Chang, H.-H., \u0026 Hau, K.-T. (2002). Item selection in computerized adaptive testing: Improving the a-stratified design with the Sympson-Hetter algorithm. *Applied Psychological Measurement*, 26(4), 376–392.\n\n[19] Stocking, M. L., \u0026 Swanson, L. (1993). A method for severely constrained item selection in adaptive testing. *Applied Psychological Measurement*, 17(3), 277–292.\n\n[20] van der Linden, W. J. (2005). *Linear Models for Optimal Test Design*. Springer.\n\n---\n\n*Document prepared with reference to foundational MIRT and MCAT literature. All mathematical notation follows standard psychometric conventions. LaTeX formulas are rendered in Markdown-compatible environments (e.g., Obsidian, Jupyter, Pandoc with MathJax/KaTeX).*\n"])</script><script>self.__next_f.push([1,"16:T535b,"])</script><script>self.__next_f.push([1,"\n## Overview\n\nComputerized Adaptive Testing (CAT) is a form of computer-based testing that adapts in real-time to each test-taker's ability level. According to Weiss (IACAT), its objective is *\"to select, for each examinee, the set of test questions from a pre-calibrated item bank that simultaneously most effectively and efficiently measures that person on the trait\"* [1].\n\nUnlike conventional fixed-form tests where all examinees answer the same predetermined questions, CAT dynamically selects items based on the test-taker's estimated ability as they progress through the test [2]. The result is a test that is smarter, shorter, fairer, and more precise [3].\n\n---\n\n## Part 1: The Five Implementation Steps\n\nAccording to Seo (2017), there are **five steps** for implementing a CAT system [4]:\n\n### Step 1 — Determine Feasibility\nBefore building a CAT, the test program must evaluate whether CAT is appropriate:\n- Is there a sufficient volume of test-takers to calibrate items? (Rule of thumb: at least 200–300 per item)\n- Is the construct **unidimensional** (measuring one trait)? IRT-based CAT assumes this\n- Is the item bank large enough? (Recommended: at least 3× the intended test length) [3]\n- Are there sufficient resources to build and maintain the platform?\n  \n\u003e [note]:\n\u003e\n\u003e If the test volume is very small (e.g., fewer than 100 test-takers per year), it may be impossible to build a usable item bank. It is not unusual for a testing program to start with a fixed-form test and later transition to CAT once the item bank is well established [5].\n\n### Step 2 — Establish an Item Bank\nThe item bank is the foundation of CAT. It must:\n- Contain a large pool of **pre-calibrated items** with known IRT parameters\n- Cover the full range of the ability scale (very easy to very hard)\n- Be organized with content categories for content balancing\n- Items must be **pilot-tested** on a representative sample before entering the live bank\n\n\u003e [note]:\n\u003e\n\u003e \"You can't just write a few items and subjectively rank them as Easy, Medium, or Hard. Instead, you need to write a large number of items and then pilot them on a representative sample of examinees.\" [3]\n\n### Step 3 — Pretest, Calibrate, and Link Item Parameters\nEach item must be statistically calibrated through:\n- **Pilot testing** on real examinees\n- **IRT calibration** — estimating the $a$ (discrimination), $b$ (difficulty), and $c$ (guessing) parameters\n- **Linking** — placing all items on the same IRT scale so they are comparable\n\nThis is done through statistical analysis using actual candidate response data [4].\n\n### Step 4 — Specify the Five CAT Algorithm Components\nThe test developer must define all five components of the CAT algorithm (see Part 2 below) [4]:\n1. Item bank structure\n2. Starting item/point\n3. Item selection rule\n4. Scoring procedure\n5. Termination criterion\n\n### Step 5 — Deploy the CAT\nAfter specifying all components, the CAT is deployed. Ongoing management includes:\n- Content balancing\n- Item analysis and refreshment\n- Standard setting\n- Item exposure monitoring\n- Item bank updates [4]\n\n---\n\n## Part 2: The Five Core Algorithm Components\n\n### Component 1: Item Bank\n\nThe item bank is a pool of pre-calibrated items, each with known IRT parameters [4, 5].\n\nKey requirements:\n- **Size:** Typically at least 5–10× the test length to allow adequate item selection and exposure control\n- **Coverage:** Items spanning the full difficulty range ($-3 \\leq \\theta \\leq 3$)\n- **Content balance:** Items organized by content domain/category\n- **Parameters:** Each item has at minimum a difficulty ($b$) parameter; ideally also discrimination ($a$) and guessing ($c$) for the 3PL model\n\n---\n\n### Component 2: Starting Point\n\nThe starting point determines where the test begins on the ability scale. There are three common options [1, 3]:\n\n| Option | Description | Use Case |\n|---|---|---|\n| **Fixed value** | Everyone starts at $\\hat{\\theta}_0 = 0$ (population mean) | Most common for general tests |\n| **Randomized** | Start within a narrow range, e.g., $\\hat{\\theta}_0 \\in [-0.5,\\ 0.5]$ | Improves test security and item exposure |\n| **Predicted value** | Based on prior data or external information | When prior ability estimate is available |\n\n\u003e [note]:\n\u003e \n\u003e \"At the initial stages of a CAT, when only a single item or two has been administered, the next item is usually selected by a step rule — if the first item was answered correctly, the examinee's original theta estimate is increased by some amount (e.g., 0.50); if the first item was answered incorrectly, the original theta estimate is decreased by the same amount.\" [1]\n\n---\n\n### Component 3: Item Selection Rule (Algorithm)\n\nThis is the **heart of the CAT**. After each response, the algorithm selects the next best item from the unused items in the bank [5].\n\nThe item selection process involves three sub-components [5]:\n\n#### 3a. Item Selection Criterion\n\nThe most common methods are `Maximum Fisher Information` and `b-Matching` [5, 6]:\n\n**Maximum Fisher Information (most common)**\n\nSelects the item $i^*$ providing the highest statistical information at the current ability estimate $\\hat{\\theta}$:\n\n$$i^* = \\underset{i \\notin \\mathcal{U}}{\\arg\\max}\\ I_i(\\hat{\\theta})$$\n\nWhere $I_i(\\hat{\\theta})$ is the Item Information Function (IIF) evaluated at $\\hat{\\theta}$, and $\\mathcal{U}$ is the set of already-used items.\n\nFor the **3-Parameter Logistic (3PL)** model, the IIF is:\n\n$$I_i(\\theta) = \\frac{a_i^2 \\left[P_i(\\theta) - c_i\\right]^2}{(1 - c_i)^2} \\cdot \\frac{1 - P_i(\\theta)}{P_i(\\theta)}$$\n\nWhere $P_i(\\theta)$ is the probability of a correct response given by the 3PL model:\n\n$$P_i(\\theta) = c_i + \\frac{1 - c_i}{1 + e^{-a_i(\\theta - b_i)}}$$\n\n**b-Matching (difficulty matching)**\n\nSelects the item whose difficulty $b_i$ is closest to the current theta estimate:\n\n$$i^* = \\underset{i \\notin \\mathcal{U}}{\\arg\\min}\\ |b_i - \\hat{\\theta}|$$\n\nSimple but effective; does not require full IIF calculation.\n\n**Other criteria:** $a$-stratification, weighted likelihood, Kullback-Leibler information [5].\n\n#### 3b. Content Balancing\nEnsures the test covers required content domains proportionally — not just statistically optimal items. This addresses the concern of educators and subject matter experts who require balanced content coverage [2, 5].\n\n#### 3c. Item Exposure Control\nPrevents certain items from being administered too frequently, which would compromise test security [5]. Common methods:\n- **Randomesque method** — randomly selects from the top-$k$ most informative items\n- **Sympson-Hetter method** — probabilistically suppresses overexposed items\n- **Fade-away method** — gradually reduces exposure of frequently used items\n\n\u003e [note]:\n\u003e\n\u003e \"Selecting the right method for each of the 3 components of the item selection process — content balancing, the item selection criterion, and item exposure control — is not straightforward and cannot be considered separately for each of these 3 components because of the unique interactions among them.\" [5]\n\n---\n\n### Component 4: Scoring Procedure (Theta Estimation)\n\nAfter each response, the test-taker's ability estimate $\\hat{\\theta}$ is updated [2, 6].\n\nThe scoring algorithm takes all previous responses into account — not just the most recent one. Let $\\mathbf{u} = (u_1, u_2, \\ldots, u_n)$ denote the vector of responses where $u_j = 1$ if correct and $u_j = 0$ if incorrect.\n\n#### Maximum Likelihood Estimation (MLE)\n\nFinds the $\\hat{\\theta}$ that maximizes the likelihood of the observed response pattern:\n\n$$\\hat{\\theta}_{MLE} = \\underset{\\theta}{\\arg\\max}\\ L(\\theta \\mid \\mathbf{u})$$\n\nThe likelihood function is:\n\n$$L(\\theta \\mid \\mathbf{u}) = \\prod_{j=1}^{n} P_j(\\theta)^{u_j} \\left[1 - P_j(\\theta)\\right]^{1 - u_j}$$\n\nIn practice, the log-likelihood is maximized:\n\n$$\\ell(\\theta) = \\sum_{j=1}^{n} \\left[ u_j \\ln P_j(\\theta) + (1 - u_j) \\ln(1 - P_j(\\theta)) \\right]$$\n\n- **Pro:** Unbiased estimate\n- **Con:** Undefined when all responses are correct or all incorrect [1]\n\n#### Bayesian EAP (Expected A Posteriori)\n\nCombines the likelihood with a prior distribution $\\pi(\\theta)$ (typically standard normal $\\mathcal{N}(0, 1)$):\n\n$$\\hat{\\theta}_{EAP} = \\frac{\\int_{-\\infty}^{\\infty} \\theta \\cdot L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta)\\ d\\theta}{\\int_{-\\infty}^{\\infty} L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta)\\ d\\theta}$$\n\n- **Pro:** Works even with all-correct or all-incorrect response patterns\n- **Pro:** Provides a natural standard error estimate\n- **Con:** Slightly biased toward the prior mean in early items [6]\n\n#### Bayesian MAP (Maximum A Posteriori)\n\nTakes the mode of the posterior distribution:\n\n$$\\hat{\\theta}_{MAP} = \\underset{\\theta}{\\arg\\max}\\ \\left[ L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta) \\right]$$\n\nIntermediate between MLE and EAP in terms of bias and variance.\n\n\u003e [note]:\n\u003e\n\u003e \"The algorithm then selects the most informative item from the calibrated item bank based on this estimate. After the examinee responds, the ability estimate is updated using maximum likelihood or Bayesian methods, and the cycle continues until a stopping criterion is met.\" [6]\n\n#### Standard Error of Measurement (SEM)\n\nThe precision of the theta estimate is tracked via the **Test Information Function**:\n\n$$\\text{TIF}(\\theta) = \\sum_{j=1}^{n} I_j(\\theta)$$\n\nThe Standard Error of Measurement is:\n\n$$SE(\\hat{\\theta}) = \\frac{1}{\\sqrt{\\text{TIF}(\\hat{\\theta})}} = \\frac{1}{\\sqrt{\\sum_{j=1}^{n} I_j(\\hat{\\theta})}}$$\n\nThe SEM **decreases** as more items are administered. CAT continues until $SE(\\hat{\\theta})$ falls below a specified threshold.\n\n---\n\n### Component 5: Termination Criterion\n\nThe stopping rule decides when to end the test. Common criteria [2, 4, 6]:\n\n| Criterion | Condition | Advantage |\n|---|---|---|\n| **Fixed length** | Stop after $N$ items | Simple, equal testing time |\n| **Fixed precision** | Stop when $SE(\\hat{\\theta}) \u003c \\epsilon$ | Precision-based; adaptive length |\n| **Combined** | Stop when $SE(\\hat{\\theta}) \u003c \\epsilon$ OR $n \\geq N_{max}$ | Balances precision and efficiency |\n| **Classification** | Stop when ability is clearly above/below a cut score $\\theta_c$ | Used in pass/fail exams (e.g., NCLEX) |\n| **Time limit** | Stop after maximum time $T$ | Practical constraint |\n\nFor **classification-based** stopping (e.g., pass/fail), the decision rule is:\n\n$$\\text{Decision} = \\begin{cases} \\text{Pass} \u0026 \\text{if } \\hat{\\theta} - z_{\\alpha/2} \\cdot SE(\\hat{\\theta}) \u003e \\theta_c \\\\ \\text{Fail} \u0026 \\text{if } \\hat{\\theta} + z_{\\alpha/2} \\cdot SE(\\hat{\\theta}) \u003c \\theta_c \\\\ \\text{Continue} \u0026 \\text{otherwise} \\end{cases}$$\n\nWhere $\\theta_c$ is the passing cut score and $z_{\\alpha/2}$ is the critical value at significance level $\\alpha$.\n\n\u003e [note]:\n\u003e \n\u003e \"Fixed-length tests administer a predetermined number of items, while precision-based stopping continues until the standard error of measurement falls below a threshold.\" [6]\n\n\u003e [note]:\n\u003e\n\u003e For high-stakes exams like the NCLEX:\n\u003e \"This pattern continues until you run out of time or until the computer identifies your competency level as above or below the passing standard.\" [7]\n\n#### What the Literature Actually Says About CAT Stopping Criteria\n\nThe Authoritative Source — van der Linden \u0026 Glas (2000) [11]. The most cited CAT textbook defines three legitimate stopping rules:\n\n##### Rule 1 — Fixed Length\n\n$$stop when n=N$$\n\nSimple, equal test length for all. Does not guarantee equal precision.\n\n##### Rule 2 — Fixed Precision (SE-based)\n\n$$stop when SE(\\hat{\\theta})\u003c\\epsilon$$\n\nGuarantees equal measurement precision. Test length varies by person.\n\n##### Rule 3 — Classification / Sequential Probability Ratio Test (SPRT)\n\n$$stop when ability is clearly above or below a cut score θ_c​$$\n\n\n#### Used in pass/fail exams like NCLEX\n\n\u003e [note]:\n\u003e \n\u003e \"The fixed-precision rule is preferred when the goal is to produce scores of equal reliability across all test-takers.\" — van der Linden \u0026 Glas (2000) [11]\n\n---\n\n#### Seo (2017) on Combined Rules [4]\n\n\u003e [note]:\n\u003e\n\u003e \"In practice, a combination of stopping rules is recommended — a precision-based primary rule with a maximum item count as a safety cap to prevent excessively long tests.\"\n\nThe standard combined rule is:\n\n$$stop when SE(\\hat{\\theta})\u003c\\epsilon\\quad OR\\quad n≥N_{max}​$$\n\nBank exhaustion is NOT listed as a standard stopping criterion in any major CAT reference. It is an emergency fallback for implementation purposes only.\n\n---\n\n#### Weiss (IACAT) [1]\n\n\"The test terminates when a specified level of measurement precision has been achieved, typically when the standard error of the ability estimate falls below a predetermined value.\"\n\nNo mention of bank exhaustion as a stopping criterion.\n\n---\n\n#### The Correct Stopping Rule Hierarchy\n\nBased on the literature [11, 1, 4], the proper priority order is:\n```\nPriority 1 (primary)  :   SE(θ̂) \u003c ε          → STOP — precision achieved\nPriority 2 (safety)   :   n ≥ N_max          → STOP — too many items\nPriority 3 (emergency):   bank exhausted     → STOP WITH WARNING — bank limitation\n```\nThe first rule that fires wins. Bank exhaustion should always come last and always produce a warning.\n\n---\n\n## Part 3: The Full CAT Runtime Process\n\nOnce deployed, the following iterative process runs for each test-taker [2, 33]:\n\n```mermaid\nflowchart TD\n    A([Start]) --\u003e B[\"1. Set Starting Point\u003cbr\u003etheta = 0 or prior estimate\u003cbr\u003eResponse history = empty\"]\n    B --\u003e C[\"2. Select Next Item\u003cbr\u003eFrom unused items in bank\u003cbr\u003eApply content balancing\u003cbr\u003eApply exposure control\u003cbr\u003eSelect i-star = argmax I_i\"]\n    C --\u003e D[\"3. Administer Item\u003cbr\u003ePresent item i-star to test-taker\u003cbr\u003eRecord response = 0 or 1\u003cbr\u003eAdd i-star to used set U\"]\n    D --\u003e E[\"4. Update Ability Estimate\u003cbr\u003eUpdate response vector u\u003cbr\u003eRecalculate theta via MLE or EAP\u003cbr\u003eSE = 1 divided by sqrt of sum I\"]\n    E --\u003e F{\"5. Termination Criterion Met?\u003cbr\u003eSE less than epsilon OR n gte N_max\"}\n    F --\u003e|No| C\n    F --\u003e|Yes| G[\"6. Report Final Score\u003cbr\u003eReport theta and SE\u003cbr\u003eApply score transformation\"]\n    G --\u003e H([End])\n```\n\n---\n\n## Part 4: IRT Models Used in CAT\n\nCAT is built on Item Response Theory. The three most common models are [10]:\n\n### 1PL — Rasch Model\nOnly difficulty $b$ varies between items; discrimination is fixed at $a = 1$ and guessing $c = 0$:\n\n$$P_i(\\theta) = \\frac{1}{1 + e^{-(\\theta - b_i)}}$$\n\n### 2PL Model\nBoth difficulty $b$ and discrimination $a$ vary; no guessing ($c = 0$):\n\n$$P_i(\\theta) = \\frac{1}{1 + e^{-a_i(\\theta - b_i)}}$$\n\n### 3PL Model (most common in high-stakes CAT)\nAll three parameters vary — discrimination $a_i$, difficulty $b_i$, and guessing $c_i$:\n\n$$P_i(\\theta) = c_i + \\frac{1 - c_i}{1 + e^{-a_i(\\theta - b_i)}}$$\n\nWhere:\n- $\\theta \\in (-\\infty, +\\infty)$, typically $[-3, 3]$ — test-taker ability\n- $a_i \u003e 0$ — item discrimination (steepness of the curve)\n- $b_i \\in [-3, 3]$ — item difficulty (location of the curve)\n- $c_i \\in [0, 1]$ — pseudo-guessing parameter (lower asymptote)\n\n---\n\n## Part 5: Historical Origins\n\nThe adaptive testing concept is not new. Its origins can be traced to Alfred Binet's IQ test (1905), which used an adaptive procedure: items were organized by age-difficulty level, and the examiner would probe upward or downward based on each child's responses [1].\n\nThe key historical milestones are [1, 8]:\n\n| Year | Event |\n|---|---|\n| 1905 | Binet's adaptive IQ test — first adaptive testing procedure |\n| 1952 | Lord observes that ability scores are test-independent (unlike observed scores) |\n| 1960 | Rasch describes the one-parameter logistic IRT model |\n| 1973 | Weiss proposes the \"stradaptive\" computer-delivered test |\n| 1980 | Lord publishes the foundational IRT textbook |\n| 1994 | NCLEX (nursing licensure exam) adopts CAT — first large-scale operational use |\n| 2007 | National Registry of Emergency Medical Technicians adopts CAT |\n\n---\n\n## Part 6: Practical Example — How CAT Selects Items\n\nThe following example illustrates the item selection process step by step [3]:\n\n\u003e Suppose we have five items in the bank and the starting theta is $\\hat{\\theta}_0 = 0.0$.\n\n**Round 1:**\n- Compute $I_i(0.0)$ for all items → **Item 4** has highest information\n- Test-taker answers **incorrectly** ($u_1 = 0$)\n- Run MLE/EAP → new estimate: $\\hat{\\theta}_1 = -2.0$\n- Check termination: $SE(\\hat{\\theta}_1)$ too large, continue\n\n**Round 2:**\n- Compute $I_i(-2.0)$ for remaining items → **Item 2** has highest information\n- Test-taker answers **correctly** ($u_2 = 1$)\n- Update theta → $\\hat{\\theta}_2 = -0.8$\n- Check termination: not done yet\n\n**Round 3:**\n- Item 2 and Item 4 already used ($\\mathcal{U} = \\{2, 4\\}$)\n- Next best available at $\\hat{\\theta}_2 = -0.8$ → **Item 1**\n- Test-taker answers correctly ($u_3 = 1$, item is easy)\n- Update theta → $\\hat{\\theta}_3 = -0.2$\n- Continue...\n\nThis demonstrates how CAT **homes in** on the test-taker's true ability through successive approximation.\n\n---\n\n## Part 7: Advantages and Challenges\n\n### Advantages \n\n| Advantage | Detail |\n|---|---|\n| **Efficiency** | Typically 50% fewer items needed for same precision |\n| **Equal precision** | $SE(\\hat{\\theta})$ is controlled uniformly across all ability levels |\n| **Fairness** | Each test-taker gets items appropriate to their level |\n| **Immediate results** | Scoring is done in real-time |\n| **Security** | Unique item sets make sharing answers less useful |\n| **Adaptive length** | Test ends when $SE(\\hat{\\theta}) \u003c \\epsilon$ |\n\n[2, 4, 6]\n\n### Challenges \n\n| Challenge | Detail |\n|---|---|\n| **Item bank development** | Requires large pilot studies to calibrate $a$, $b$, $c$ parameters |\n| **Cost** | Expensive to build and maintain the platform |\n| **Test-taker experience** | Test-takers may feel discouraged if items seem consistently hard |\n| **Content balance** | Purely statistical selection (argmax $I_i(\\hat{\\theta})$) may neglect content coverage |\n| **Item exposure** | Items with high $I_i(\\theta)$ at common $\\theta$ values are overused |\n| **Unidimensionality** | IRT assumes a single latent trait $\\theta$; multidimensional constructs are harder |\n\n[2, 4, 5]\n\n\u003e [note]:\n\u003e\n\u003e \"A trade-off must be made between the psychological experiences of test-takers and measurement efficiency.\" [2]\n\n---\n\n## Part 8: Real-World Applications\n\nCAT is used in many high-stakes assessments worldwide [1, 4]:\n\n| Exam | Domain | CAT Since |\n|---|---|---|\n| **NCLEX-RN / NCLEX-PN** | Nursing licensure (USA) | 1994 |\n| **GRE General Test** | Graduate school admissions | 1994 |\n| **GMAT** | Business school admissions | 1997 |\n| **NREMT** | Emergency Medical Technicians | 2007 |\n| **TOEFL iBT** | English language proficiency | adaptive sections |\n| **ASVAB-CAT** | US Military enlistment | adaptive version |\n\n---\n\n## Summary\n\nThe CAT process can be summarized in three phases:\n\n**Before the test (Development):**\n1. Determine feasibility\n2. Write and pilot items\n3. Calibrate IRT parameters ($a_i$, $b_i$, $c_i$)\n4. Build and validate the item bank\n5. Define all five algorithm components\n\n**During the test (Runtime loop):**\n1. Set starting point $\\hat{\\theta}_0$\n2. Select $i^* = \\arg\\max\\ I_i(\\hat{\\theta})$ from unused items\n3. Administer item, record response $u \\in \\{0, 1\\}$\n4. Update $\\hat{\\theta}$ using MLE or EAP; compute $SE(\\hat{\\theta})$\n5. Check stopping rule → repeat or stop\n\n**After the test (Reporting):**\n1. Report final $\\hat{\\theta}$ and $SE(\\hat{\\theta})$\n2. Apply score transformation if needed\n3. Log responses for item bank maintenance\n\n---\n\n## References\n\n[1] Weiss, D. J. (n.d.). *Introduction to CAT*. International Association for Computerized Adaptive Testing (IACAT). https://iacat.org/introduction-to-cat/\n\n[2] Kim, J., \u0026 Chung, H. (2017). The impacts of computer adaptive testing from a variety of perspectives. *PMC*. https://pmc.ncbi.nlm.nih.gov/articles/PMC5549015/\n\n[3] Assessment Systems Corporation. (2025). *Computerized Adaptive Testing (CAT): Software, Meaning, Example*. https://assess.com/computerized-adaptive-testing/\n\n[4] Seo, D. G. (2017). Overview and current management of computerized adaptive testing in licensing/certification examinations. *Journal of Educational Evaluation for Health Professions, 14*, 17. https://doi.org/10.3352/jeehp.2017.14.17\n\n[5] Kim, D., \u0026 Chung, H. (2018). Components of the item selection algorithm in computerized adaptive testing. *Journal of Educational Evaluation for Health Professions*. https://pmc.ncbi.nlm.nih.gov/articles/PMC5968224/\n\n[6] Cogn-IQ. (2026). *Adaptive Testing in Psychometrics — Definition \u0026 Examples*. https://www.cogn-iq.org/learn/theory/adaptive-testing/\n\n[7] UWorld Nursing. (2025). *What Is NCLEX Computerized Adaptive Testing (CAT)?* https://nursing.uworld.com/blog/nclex-computer-adaptive-test/\n\n[8] Janssen, R., \u0026 De Boeck, P. (2010). *Computerized adaptive testing: implementation issues*. arXiv. https://arxiv.org/pdf/1012.0042\n\n[9] Wikipedia contributors. (2026). *Computerized adaptive testing*. Wikipedia. https://en.wikipedia.org/wiki/Computerized_adaptive_testing\n\n[10] Lord, F. M. (1980). *Applications of Item Response Theory to Practical Testing Problems*. Lawrence Erlbaum Associates.\n\n[11] van der Linden, W. J., \u0026 Glas, C. A. W. (2000). Computerized Adaptive Testing: Theory and Practice. Kluwer Academic Publishers.\n"])</script><script>self.__next_f.push([1,"17:T20140,"])</script><script>self.__next_f.push([1,"\n## Prerequisites\n\nBefore starting this tutorial, make sure you have:\n- Concerto Platform running via Docker (`docker-compose up -d`)\n- Access to `http://localhost/login` and logged in as admin\n- Read the CAT Theory document to understand IRT concepts\n\n---\n\n## Concerto Platform — Known Rules (From Experience)\n\nBefore building, understand these important rules discovered through testing:\n\n| Rule | Detail |\n|---|---|\n| ✅ Use `showPage` not `form` | `form` node does not pass variables correctly |\n| ✅ Enter HTML directly | Use the HTML field in `showPage`, not templates |\n| ✅ Use Flow variable pointers | All data ports need ↑ (output) or ↓ (input) Flow variable pointer set |\n| ✅ Use default `out` port | Do not use custom branch names or `.branch` |\n| ✅ Use `if` node with variable | Pass a `TRUE/FALSE` variable to `if` node expression |\n| ✅ Use SQL syntax | `concerto.table.query(\"SELECT * FROM table\")` not `table=` argument |\n| ❌ No custom `.branch` names | Custom execution ports with `.branch` don't work reliably |\n| ❌ No `form` node | Variables don't pass through correctly |\n| ❌ No `table=` argument | `concerto.table.query(table=\"x\")` throws an error |\n\n---\n\n## Concept: What is the 3PL Model (with Guessing)?\n\nThe **3-Parameter Logistic (3PL)** model extends basic IRT by adding a **guessing parameter (c)** [2, 5]:\n\n$$P_i(\\theta) = c_i + \\frac{1 - c_i}{1 + e^{-a_i(\\theta - b_i)}}$$\n\nWhere:\n- $\\theta$ **(theta)** — test-taker's ability estimate (starts at 0)\n- $a$ — discrimination: how well the item separates ability levels\n- $b$ — difficulty: the ability level at which $P = 0.5$ (ignoring guessing)\n- $c$ — guessing: minimum probability of correct answer (e.g. 0.25 for 4-choice MCQ)\n\n### Why does guessing matter?\n\nWithout guessing (2PL), if theta is very low, $P(\\text{correct}) \\rightarrow 0$. But in reality, a test-taker can still guess correctly — especially on multiple choice. The guessing parameter $c$ sets a **floor** on the probability [2]:\n\n$$\\lim_{\\theta \\to -\\infty} P_i(\\theta) = c_i = 0.25 \\quad \\text{(for 4-choice MCQ)}$$\n\n### Item Information with Guessing\n\nThe information provided by a 3PL item is [3, 5]:\n\n$$I_i(\\theta) = \\frac{a_i^2 \\left[P_i(\\theta) - c_i\\right]^2}{(1 - c_i)^2} \\cdot \\frac{1 - P_i(\\theta)}{P_i(\\theta)}$$\n\nItems with **high discrimination ($a$)** and **difficulty near current theta ($b \\approx \\theta$)** provide the most information [3, 14].\n\n---\n\n## Concept: Bayesian EAP Theta Estimation\n\nThis tutorial uses **Bayesian Expected A Posteriori (EAP)** estimation — the most robust method for CAT theta estimation [8, 10].\n\n### Why Bayesian EAP instead of Newton-Raphson?\n\n| Method | Pro | Con |\n|---|---|---|\n| Newton-Raphson | Fast, simple | Undefined when all answers correct or all incorrect; can diverge [9] |\n| Bayesian EAP | Works for all response patterns; stable; provides SE [8] | Slightly biased toward prior in early items [10] |\n\n### How EAP Works\n\nEAP combines the **likelihood** of the observed responses with a **prior distribution** (our belief about ability before the test) [8]:\n\n$$\\hat{\\theta}_{EAP} = \\frac{\\int_{-\\infty}^{\\infty} \\theta \\cdot L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta)\\ d\\theta}{\\int_{-\\infty}^{\\infty} L(\\theta \\mid \\mathbf{u}) \\cdot \\pi(\\theta)\\ d\\theta}$$\n\nWhere:\n- $L(\\theta \\mid \\mathbf{u}) = \\prod_{j=1}^{n} P_j(\\theta)^{u_j} [1-P_j(\\theta)]^{1-u_j}$ — likelihood of all responses\n- $\\pi(\\theta) = \\mathcal{N}(0, 1)$ — standard normal prior (most people have average ability)\n- $\\mathbf{u} = (u_1, \\ldots, u_n)$ — vector of responses (1=correct, 0=incorrect)\n\n### Numerical Approximation (used in our R code)\n\nThe integral is approximated using **Gauss-Hermite quadrature** — evaluating the integrand at a grid of $K$ theta points $\\{\\theta_k\\}$ with weights $\\{w_k\\}$ [6, 8]:\n\n$$\\hat{\\theta}_{EAP} \\approx \\frac{\\sum_{k=1}^{K} \\theta_k \\cdot L(\\theta_k \\mid \\mathbf{u}) \\cdot \\pi(\\theta_k)}{\\sum_{k=1}^{K} L(\\theta_k \\mid \\mathbf{u}) \\cdot \\pi(\\theta_k)}$$\n\nThe **Standard Error** is also computed from the posterior variance:\n\n$$SE_{EAP} = \\sqrt{\\frac{\\sum_{k=1}^{K} (\\theta_k - \\hat{\\theta}_{EAP})^2 \\cdot L(\\theta_k \\mid \\mathbf{u}) \\cdot \\pi(\\theta_k)}{\\sum_{k=1}^{K} L(\\theta_k \\mid \\mathbf{u}) \\cdot \\pi(\\theta_k)}}$$\n\n---\n\n## Part 1: Create the Item Bank (Data Table)\n\n### Concept\nThe item bank stores all test questions along with their IRT parameters. The **3PL model** requires three parameters per item: discrimination ($a$), difficulty ($b$), and guessing ($c$) [2, 5, 15].\n\n### Steps\n\n1. Click **Data Tables** in the left menu → **Add new**\n2. Name it `item_bank_3pl`\n3. Add these columns by clicking **Add column**:\n\n| Column Name | Type | Description |\n|---|---|---|\n| `question` | string | The question text |\n| `option_a` | string | Choice A |\n| `option_b` | string | Choice B |\n| `option_c` | string | Choice C |\n| `option_d` | string | Choice D |\n| `correct_answer` | string | Correct option: A, B, C, or D |\n| `difficulty` | decimal | IRT $b$ parameter (range: -3 to +3) |\n| `discrimination` | decimal | IRT $a$ parameter (range: 0 to 3) |\n| `guessing` | decimal | IRT $c$ parameter (range: 0 to 0.35) |\n\n4. Click **Save**\n5. Click **Edit data** and add sample items with varying difficulty:\n\n| question | option_a | option_b | option_c | option_d | correct_answer | difficulty | discrimination | guessing |\n|---|---|---|---|---|---|---|---|---|\n| What is 1+1? | 1 | 2 | 3 | 4 | B | -2.0 | 0.8 | 0.25 |\n| What is 5-3? | 1 | 2 | 3 | 4 | B | -1.5 | 1.0 | 0.25 |\n| What is 4x3? | 10 | 12 | 14 | 16 | B | -1.0 | 1.2 | 0.25 |\n| What is 15/3? | 3 | 4 | 5 | 6 | C | -0.5 | 1.3 | 0.25 |\n| What is 7x8? | 54 | 56 | 58 | 60 | B | 0.0 | 1.5 | 0.25 |\n| What is 12²? | 124 | 140 | 144 | 148 | C | 0.5 | 1.4 | 0.25 |\n| What is √169? | 11 | 12 | 13 | 14 | C | 1.0 | 1.6 | 0.25 |\n| What is 17x13? | 201 | 211 | 221 | 231 | C | 1.5 | 1.7 | 0.25 |\n| What is 2^10? | 512 | 1024 | 2048 | 4096 | B | 2.0 | 1.8 | 0.25 |\n| What is log₂(256)? | 6 | 7 | 8 | 9 | C | 2.5 | 2.0 | 0.25 |\n\n6. Click **Save**\n\n\u003e **Note:** All guessing values are 0.25 because these are 4-choice MCQ items. The probability of guessing correctly = 1/4 = 0.25.\n\n---\n\n## Part 2: Create the Test\n\n1. Click **Tests** → **Add new** → name it `cat_3pl_test` → **Save**\n2. Click the **Test flow** tab\n3. You will see `test start` and `test end` on the canvas\n\n---\n\n## Part 3: Build the Test Flow\n\n### Final Flow Overview\n\n```\n[test start]\n     ↓\n[eval - init]           Initialize all variables + response history\n     ↓\n[eval - select item] ←──────────────────────────┐\n     ↓                                           │\n[showPage - question]   Show item to user        │\n     ↓                                           │\n[eval - score]          Score + Bayesian EAP     │\n     ↓                                           │\n[if]                    Test complete?           │\n  │ false ──────────────────────────────────────┘\n  │ true\n  ↓\n[eval - compute result] Compute labels + SE\n     ↓\n[showPage - result]     Show final score + SE\n     ↓\n[test end]\n```\n\n---\n\n## Node 1: `eval - init` — Initialize Variables\n\n### Concept\nThis node sets all starting values before the test begins. For Bayesian EAP, we also initialize:\n- `responses` — a vector tracking all responses (1=correct, 0=incorrect) across items\n- `items_a`, `items_b`, `items_c` — vectors tracking IRT parameters of answered items\n- `se_theta` — the standard error of the theta estimate\n- `theta = 0` — prior mean (start at average ability) [12]\n\nThe response history vectors are essential for EAP because it needs **all previous responses and item parameters** to compute the posterior, not just the most recent one [8].\n\n### Steps\n\n1. Right-click canvas → **eval**\n2. Rename it to `eval - init`\n3. Click the node → edit **Code** field → paste:\n\n```r\n# ── Ability estimate ──────────────────────────────────────────────────────────\n# Start at population mean θ = 0 (prior mean for Bayesian EAP)\ntheta    \u003c- 0\n\n# ── Standard error of theta estimate ─────────────────────────────────────────\n# Starts high (very uncertain), decreases as more items are answered\nse_theta \u003c- 999\n\n# ── Test control variables ────────────────────────────────────────────────────\nanswered  \u003c- 0      # number of items answered so far\nmax_items \u003c- 10     # fixed-length stopping rule\n\n# ── Used item tracking ────────────────────────────────────────────────────────\n# Prevents the same item from being shown twice\nused_items \u003c- c()\n\n# ── Response history — required for Bayesian EAP ─────────────────────────────\n# responses: 1 = correct, 0 = incorrect, one entry per answered item\nresponses \u003c- c()\n\n# IRT parameter history — one entry per answered item (same order as responses)\nitems_a   \u003c- c()   # discrimination parameters of answered items\nitems_b   \u003c- c()   # difficulty parameters of answered items\nitems_c   \u003c- c()   # guessing parameters of answered items\n\n# ── Question display variables ────────────────────────────────────────────────\ncorrect_answer \u003c- \"\"\nquestion       \u003c- \"\"\noption_a       \u003c- \"\"\noption_b       \u003c- \"\"\noption_c       \u003c- \"\"\noption_d       \u003c- \"\"\ncurrent_id     \u003c- 0\n\n# ── Scoring totals ────────────────────────────────────────────────────────────\ntotal_correct \u003c- 0\ntest_complete \u003c- FALSE\n```\n\n4. Click **Save**\n\n### Add output ports (↑)\n\nClick red `+` for each variable. Then click each port → check **Flow variable pointer** → set **Pointed variable name** to the same name → **Save**:\n\n- `theta`\n- `se_theta`\n- `answered`\n- `max_items`\n- `used_items`\n- `responses`\n- `items_a`\n- `items_b`\n- `items_c`\n- `correct_answer`\n- `question`\n- `option_a`\n- `option_b`\n- `option_c`\n- `option_d`\n- `current_id`\n- `total_correct`\n- `test_complete`\n\nEach should show a **↑ arrow** when done.\n\n### Connect\nDrag from `test start` **out** → `eval - init` **in**\n\n\n### Details\n\nThe `eval - init` node runs **exactly once** — at the very beginning of the test, immediately after `test start`. Its sole purpose is to **initialize every variable** that will be used throughout the entire CAT session.\n\nIt is the simplest node in the flow but also the most foundational: if any variable is missing or wrongly typed here, every subsequent node will fail.\n\n| Property | Value |\n|---|---|\n| **Runs** | Once only — at test start |\n| **Position in flow** | `test start` → `eval - init` → `eval - select item` |\n| **Purpose** | Initialize all session variables with correct types and starting values |\n| **Outputs** | All variables needed by every other node |\n\n---\n\n#### Complete R Code\n\n```r\n# ── Ability estimate ──────────────────────────────────────────────────────────\n# Start at population mean θ = 0 (prior mean for Bayesian EAP)\ntheta    \u003c- 0\n\n# ── Standard error of theta estimate ─────────────────────────────────────────\n# Starts high (very uncertain), decreases as more items are answered\nse_theta \u003c- 999\n\n# ── Test control variables ────────────────────────────────────────────────────\nanswered  \u003c- 0      # number of items answered so far\nmax_items \u003c- 10     # fixed-length stopping rule\n\n# ── Used item tracking ────────────────────────────────────────────────────────\n# Prevents the same item from being shown twice\nused_items \u003c- numeric(0)\n\n# ── Response history — required for Bayesian EAP ─────────────────────────────\n# responses: 1 = correct, 0 = incorrect, one entry per answered item\nresponses \u003c- numeric(0)\n\n# IRT parameter history — one entry per answered item (same order as responses)\nitems_a   \u003c- numeric(0)   # discrimination parameters of answered items\nitems_b   \u003c- numeric(0)   # difficulty parameters of answered items\nitems_c   \u003c- numeric(0)   # guessing parameters of answered items\n\n# ── Question display variables ────────────────────────────────────────────────\ncorrect_answer \u003c- \"\"\nquestion       \u003c- \"\"\noption_a       \u003c- \"\"\noption_b       \u003c- \"\"\noption_c       \u003c- \"\"\noption_d       \u003c- \"\"\ncurrent_id     \u003c- 0\n\n# ── Scoring totals ────────────────────────────────────────────────────────────\ntotal_correct \u003c- 0\ntest_complete \u003c- FALSE\n```\n\n---\n\n#### Variable-by-Variable Explanation\n\n---\n\n##### `theta \u003c- 0`\n\n**What it is:**\nThe current ability estimate $\\hat{\\theta}$ — the CAT's best guess of the test-taker's true latent ability on the IRT scale.\n\n```r\ntheta \u003c- 0\n```\n\n**Why start at 0:**\nIn IRT, the ability scale is standardized so that the **population mean is 0** and the standard deviation is 1. Starting at $\\hat{\\theta}_0 = 0$ means we begin with the assumption that the test-taker has average ability — the most neutral and statistically justified starting point before any evidence is collected.\n\nThis is the **prior mean** of the Bayesian EAP estimation. The standard normal prior $\\pi(\\theta) = \\mathcal{N}(0, 1)$ used in `eval - score` is centered at 0, so starting theta at 0 is consistent with the prior.\n\n**What happens if we started elsewhere:**\n\n| Starting theta | Effect |\n|---|---|\n| $\\hat{\\theta}_0 = 0$ | Neutral — most appropriate for unknown test-takers |\n| $\\hat{\\theta}_0 = -1$ | First item will be easier than necessary — wastes 1 item |\n| $\\hat{\\theta}_0 = +2$ | First item will be too hard — may discourage test-taker |\n| $\\hat{\\theta}_0 = \\text{prior score}$ | Efficient if we have prior information (e.g., previous test) |\n\n**How theta evolves:**\n```\nStart:    theta = 0.0000  (prior mean, no data)\nAfter Q1: theta = 0.3821  (answered correctly — ability estimate rises)\nAfter Q2: theta = 0.1504  (answered incorrectly — estimate falls)\nAfter Q3: theta = 0.2813  (answered correctly — rises again)\n...\nAfter Q10: theta = 0.4217  (converged estimate)\n```\n\nThe EAP algorithm in `eval - score` updates this value after every response.\n\n---\n\n##### `se_theta \u003c- 999`\n\n**What it is:**\nThe Standard Error of the theta estimate — a measure of how precisely we know the test-taker's ability:\n\n```r\nse_theta \u003c- 999\n```\n\n$$SE(\\hat{\\theta}) = \\frac{1}{\\sqrt{\\sum_{j=1}^{n} I_j(\\hat{\\theta})}}$$\n\n**Why 999 and not 0, NA, or Inf:**\n\nBefore any items are answered ($n = 0$), the true SE is mathematically infinite:\n\n$$SE = \\frac{1}{\\sqrt{0}} = \\frac{1}{0} = \\infty$$\n\nWe cannot use `Inf` directly because Concerto may corrupt infinite values during flow variable serialization. `999` is a **sentinel value** — a deliberately large finite number that means \"infinitely uncertain\":\n\n| Value | Problem |\n|---|---|\n| `Inf` | May not serialize correctly through Concerto flow pointers |\n| `NA` | Causes arithmetic errors in CI calculation: `0 ± 1.96 * NA` → `NA` |\n| `0` | Implies perfect precision — dangerously wrong |\n| `999` | ✅ Safely serializable, obviously not a real SE, makes all stopping rules evaluate correctly |\n\n**Why it matters for the stopping rule:**\nIn `eval - score`, the SE-based stopping rule is:\n\n```r\ntest_complete \u003c- (se_theta \u003c 0.3) | (answered \u003e= max_items)\n```\n\nWith `se_theta = 999` initially:\n```r\n999 \u003c 0.3   # → FALSE  ✅ test correctly does not stop before any items\n```\n\nIf `se_theta` were `0`:\n```r\n0 \u003c 0.3   # → TRUE  ❌ test would immediately end with zero items answered\n```\n\n**How SE evolves:**\n\n| After item | Typical SE | Interpretation |\n|---|---|---|\n| 0 (init) | **999** | Sentinel — no data |\n| 1 | ~0.89 | Very uncertain |\n| 3 | ~0.62 | Improving |\n| 5 | ~0.48 | Acceptable |\n| 7 | ~0.38 | Good |\n| 10 | ~0.31 | High precision |\n\nSE is a real EAP-computed value from item 1 onward — `999` exists only for the single moment before the first item is shown.\n\n---\n\n##### `answered \u003c- 0`\n\n**What it is:**\nA counter tracking how many items have been answered so far.\n\n```r\nanswered \u003c- 0\n```\n\n**Why start at 0:**\nNo items have been answered at test start. This counter increments by 1 in `eval - score` after each submission:\n\n```r\n# In eval - score:\nanswered \u003c- as.numeric(answered) + 1\n```\n\n**How it is used:**\n\n| Node | Use of `answered` |\n|---|---|\n| `showPage - question` | Displays \"Question {{answered}} of {{max_items}}\" |\n| `eval - score` | Incremented after each response |\n| `eval - score` | Used in stopping rule: `n_answered \u003e= max_items` |\n| `showPage - result` | Shows total items answered |\n| `eval - compute result` | Used for percentage correct calculation |\n\n**Why integer not logical:**\n`answered` participates in arithmetic (`answered + 1`) and comparison (`answered \u003e= max_items`), so it must be numeric. Starting as `0` (integer) ensures this.\n\n---\n\n##### `max_items \u003c- 10`\n\n**What it is:**\nThe **fixed-length stopping rule** threshold — the maximum number of items the test will administer.\n\n```r\nmax_items \u003c- 10\n```\n\n**Why 10:**\n10 is a reasonable default for a demonstration CAT. In operational CATs:\n\n| Test type | Typical length |\n|---|---|\n| Demonstration / prototype | 5–10 items |\n| Short-form CAT | 10–20 items |\n| Standard CAT | 20–40 items |\n| High-stakes certification (e.g. NCLEX) | 75–145 items |\n\n**To change the test length:**\nSimply change this one value:\n```r\nmax_items \u003c- 5    # short demo\nmax_items \u003c- 20   # standard test\nmax_items \u003c- 30   # longer assessment\n```\n\n**How it flows through the system:**\n\n```\neval - init:     max_items = 10  (set here)\n      ↓ output ↑\neval - select item: receives max_items, passes to showPage\n      ↓\nshowPage - question: displays \"Question X of 10\"\n      ↓\neval - score:    max_items received, used in:\n                 test_complete \u003c- n_answered \u003e= max_items\n```\n\n**Why defined here and not hardcoded in `eval - score`:**\nCentralizing configuration in `eval - init` means you only need to change one place to adjust test length. If it were hardcoded in `eval - score`, you would need to update two nodes whenever you changed the test length.\n\n---\n\n##### `used_items \u003c- numeric(0)`\n\n**What it is:**\nA vector tracking the IDs of all items that have already been administered. Used in `eval - select item` to exclude already-seen items from selection.\n\n```r\nused_items \u003c- numeric(0)\n```\n\n**Why `numeric(0)` and not `c()` or `NULL`:**\n\n| Initialization | Type | Problem |\n|---|---|---|\n| `c()` | NULL | `length(NULL) = 0` works, but type is ambiguous |\n| `NULL` | NULL | `c(NULL, 5)` → `5` but Concerto may serialize NULL differently |\n| `numeric(0)` | **numeric** | ✅ Explicitly numeric, empty vector of correct type |\n\nUsing `numeric(0)` ensures that when we later do `c(used_items, current_id)` where `current_id` is an integer, the result is always a numeric vector — never a character or list.\n\n**How it is used in `eval - select item`:**\n\n```r\nif (length(used_items) \u003e 0) {\n  items \u003c- items[!items$id %in% used_items, ]\n}\n```\n\nOn the first call: `length(numeric(0)) = 0` → condition is `FALSE` → filter skipped → all items available.\n\n**Progression across the test:**\n\n```r\n# Before Q1:  numeric(0)         → all 10 items available\n# Before Q2:  c(5)               → 9 items available\n# Before Q3:  c(5, 6)            → 8 items available\n# Before Q10: c(5,6,3,7,1,9,4,8,10) → 1 item remaining\n```\n\n---\n\n##### `responses \u003c- numeric(0)`\n\n**What it is:**\nA vector storing the **binary response history** — one entry per answered item:\n- `1` = correct\n- `0` = incorrect\n\n```r\nresponses \u003c- numeric(0)\n```\n\n\nThis is the $\\mathbf{u} = (u_1, u_2, \\ldots, u_n)$ vector in the EAP likelihood formula:\n\n$$L(\\theta_k \\mid \\mathbf{u}) = \\prod_{j=1}^{n} P_j(\\theta_k)^{u_j} [1-P_j(\\theta_k)]^{1-u_j}$$\n\n**Why this is critical for Bayesian EAP:**\nUnlike Newton-Raphson (which uses only the most recent item), EAP recomputes theta from scratch after every item using **all previous responses**. Without this vector, EAP cannot function — it needs the complete response history to compute the likelihood.\n\n**Why `numeric(0)` not `c()`:**\nSame reasoning as `used_items` — explicit numeric type prevents type errors when arithmetic is performed on elements in the EAP loop.\n\n**Progression across the test:**\n\n```r\n# Before Q1:  numeric(0)      → no responses yet\n# After Q1:   c(0)            → answered incorrectly\n# After Q2:   c(0, 1)         → Q2 correct\n# After Q3:   c(0, 1, 1)      → Q3 correct\n# After Q10:  c(0,1,1,0,1,0,1,1,0,1) → full history\n```\n\nIn `eval - score`, the new response is appended:\n\n```r\nresponses \u003c- c(responses, is_correct)\n```\n\n---\n\n##### `items_a \u003c- numeric(0)`, `items_b \u003c- numeric(0)`, `items_c \u003c- numeric(0)`\n\n**What they are:**\nThree parallel vectors that store the IRT parameters of every item that has been answered, in the same order as `responses`.\n\n```r\nitems_a \u003c- numeric(0)   # discrimination parameters of answered items\nitems_b \u003c- numeric(0)   # difficulty parameters of answered items\nitems_c \u003c- numeric(0)   # guessing parameters of answered items\n```\n\n**Why three separate vectors:**\nThe EAP inner loop in `eval - score` iterates over answered items and needs all three parameters for each:\n\n```r\nfor (j in seq_len(n_answered)) {\n  Pj \u003c- items_c[j] + (1 - items_c[j]) / (1 + exp(-items_a[j] * (th - items_b[j])))\n  ...\n}\n```\n\nStoring them as separate parallel numeric vectors (rather than a data frame or list) makes element-wise access inside the loop reliable and avoids type coercion issues.\n\n**Why `numeric(0)` not `c()`:**\nThe EAP code does arithmetic on these vectors (`1 - items_c[j]`, `-items_a[j] * ...`). Initializing as `numeric(0)` guarantees they are numeric before any elements are appended.\n\n**Parallel structure — they must always have the same length:**\n\n```r\n# After 3 items (responses = c(0, 1, 1)):\nitems_a \u003c- c(0.8, 1.5, 1.4)    # item 1: a=0.8, item 2: a=1.5, item 3: a=1.4\nitems_b \u003c- c(-2.0, 0.0, 0.5)   # item 1: b=-2.0, etc.\nitems_c \u003c- c(0.25, 0.25, 0.25)  # all 4-choice MCQ so c=0.25 for all\n\n# Invariant: length(responses) == length(items_a) == length(items_b) == length(items_c)\n```\n\nIn `eval - score`, all four vectors are appended together in the same block:\n\n```r\nresponses \u003c- c(responses, is_correct)\nitems_a   \u003c- c(items_a,   a_new)\nitems_b   \u003c- c(items_b,   b_new)\nitems_c   \u003c- c(items_c,   c_new)\n```\n\nThis guarantees the parallel structure is maintained across all iterations.\n\n---\n\n##### Question Display Variables\n\n**What they are:**\nPlaceholder variables for the current item's content. These are populated by `eval - select item` before each question is shown.\n\n```r\ncorrect_answer \u003c- \"\"\nquestion       \u003c- \"\"\noption_a       \u003c- \"\"\noption_b       \u003c- \"\"\noption_c       \u003c- \"\"\noption_d       \u003c- \"\"\ncurrent_id     \u003c- 0\n```\n\n**Why initialize as empty strings:**\nThese variables must exist as flow variables from the very first node. If they were not initialized here, `eval - select item` might receive `NULL` on the first iteration, causing errors during type conversion or string operations.\n\n**Why `current_id \u003c- 0` (not `numeric(0)`):**\n`current_id` is used in a SQL WHERE clause in `eval - score`:\n\n```r\npaste0(\"SELECT * FROM item_bank_3pl WHERE id = \", current_id)\n```\n\nAn ID of `0` produces valid (if harmless) SQL: `WHERE id = 0`. This will return zero rows — safely handled. By contrast, `numeric(0)` would produce `WHERE id = ` (incomplete SQL — an error).\n\n**Flow of display variables:**\n\n```\neval - init:          question = \"\"    (blank placeholder)\n      ↓\neval - select item:   question = \"What is 7x8?\"   (filled by item selection)\n      ↓\nshowPage - question:  {{question}} → \"What is 7x8?\"   (displayed to user)\n      ↓\neval - score:         correct_answer used for scoring\n      ↓\neval - select item:   question = \"What is √169?\"  (next item, overwrites)\n      ↓\nshowPage - question:  {{question}} → \"What is √169?\"\n```\n\n---\n\n##### `total_correct \u003c- 0`\n\n**What it is:**\nA running count of how many items the test-taker answered correctly.\n\n```r\ntotal_correct \u003c- 0\n```\n\n**How it is updated in `eval - score`:**\n\n```r\nis_correct    \u003c- as.integer(answer == correct_answer)\ntotal_correct \u003c- as.numeric(total_correct) + is_correct\n```\n\n**How it is used in `eval - compute result`:**\n\n```r\npct_correct \u003c- round((total_correct / answered) * 100, 1)\n```\n\n**Why this is separate from theta:**\n`total_correct` is a classical test theory metric (raw score / percentage correct). Theta is an IRT metric. They measure the same construct differently:\n\n| Metric | Type | Range | Properties |\n|---|---|---|---|\n| `total_correct` | Classical | 0 to `max_items` | Simple count, scale-dependent |\n| `theta` | IRT | $-4$ to $+4$ | Scale-independent, comparable across test forms |\n\nBoth are reported on the results page to give test-takers a familiar score alongside the IRT estimate.\n\n---\n\n##### `test_complete \u003c- FALSE`\n\n**What it is:**\nA logical flag that controls whether the `if` node routes to the next item or to the results page.\n\n```r\ntest_complete \u003c- FALSE\n```\n\n**Why initialize as `FALSE`:**\nAt test start, the test is obviously not complete. Initializing as `FALSE` means the `if` node expression `test_complete` evaluates correctly on the first pass without errors.\n\n**How it is updated in `eval - score`:**\n\n```r\ntest_complete \u003c- n_answered \u003e= max_items\n```\n\n**How the `if` node uses it:**\n\n```\ntest_complete = FALSE  →  if node \"false\" port  →  loop back to eval - select item\ntest_complete = TRUE   →  if node \"true\" port   →  go to eval - compute result\n```\n\n**Why logical not integer:**\nThe `if` node expression field expects a logical (`TRUE`/`FALSE`) value. If `test_complete` were an integer (`0` or `1`), the `if` node might not evaluate it correctly. Initializing as `FALSE` (logical) and keeping it as logical throughout avoids this issue.\n\n---\n\n#### Why Every Variable Must Be Initialized Here\n\nConcerto flow variable pointers only work for variables that **already exist** in the R session. If a variable is first created in `eval - select item` or `eval - score` (instead of `eval - init`), it will not be available as a flow variable in earlier rounds when the loop returns to that node.\n\nThe pattern is:\n\n```\neval - init creates ALL variables with correct types\n      ↓\neval - select item reads some, overwrites some, passes all forward\n      ↓\nshowPage - question reads some, adds `answer`\n      ↓\neval - score reads all, updates some, passes all forward\n      ↓\nif node routes based on test_complete\n      ↓\nloop back to eval - select item (which now has updated values from eval - score)\n```\n\nIf any variable is missing from `eval - init`, the first time the loop returns to `eval - select item`, that variable will be `NULL` — causing either a silent error or a crash.\n\n---\n\n#### Type Choices — Why They Matter\n\n| Variable | Type | Why this type |\n|---|---|---|\n| `theta` | `numeric` (double) | IRT computations require decimal precision |\n| `se_theta` | `numeric` (double) | SE is always a decimal; 999 is sentinel for ∞ |\n| `answered` | `numeric` (integer-like) | Counter — arithmetic `+1` must work |\n| `max_items` | `numeric` (integer-like) | Comparison `\u003e= max_items` must work |\n| `used_items` | `numeric(0)` (empty numeric) | `%in%` comparison with integer IDs |\n| `responses` | `numeric(0)` (empty numeric) | Arithmetic in EAP loop: `u_j * log(P_j)` |\n| `items_a/b/c` | `numeric(0)` (empty numeric) | Arithmetic in EAP: `exp(-a*(th-b))` |\n| `question` etc | `\"\"` (character) | Template substitution requires strings |\n| `current_id` | `0` (numeric) | SQL WHERE clause concatenation |\n| `total_correct` | `0` (numeric) | Arithmetic `+= is_correct` |\n| `test_complete` | `FALSE` (logical) | `if` node expression evaluates logicals |\n\n\n---\n\n#### Summary\n\n`eval - init` is the **configuration and initialization hub** of the entire CAT session. Its design principles are:\n\n1. **Initialize everything** — every variable used anywhere in the flow must be created here with the correct type\n2. **Use safe types** — `numeric(0)` for empty vectors, `FALSE` for logicals, `0` for numeric counters\n3. **Use sentinel values** — `se_theta = 999` for \"not yet computed\" infinity\n4. **Centralize configuration** — `max_items = 10` here means one place to change test length\n5. **Export everything** — every variable needs an output port with Flow variable pointer (↑)\n\n---\n\n## Node 2: `eval - select item` — CAT Item Selection (3PL Maximum Information)\n\n### Concept\nSelects the next item using the **Maximum Information** criterion based on the 3PL model [3, 11, 14].\n\n**Step 1:** Compute $P_i(\\hat{\\theta})$ for each remaining item [2]:\n$$P_i(\\theta) = c_i + \\frac{1 - c_i}{1 + e^{-a_i(\\theta - b_i)}}$$\n\n**Step 2:** Compute $I_i(\\hat{\\theta})$ for each item [3, 5]:\n$$I_i(\\theta) = \\frac{a_i^2 [P_i(\\theta) - c_i]^2}{(1-c_i)^2} \\cdot \\frac{1 - P_i(\\theta)}{P_i(\\theta)}$$\n\n**Step 3:** Select $i^* = \\underset{i \\notin \\mathcal{U}}{\\arg\\max}\\ I_i(\\hat{\\theta})$ [11, 14]\n\n### Steps\n\n1. Right-click canvas → **eval**\n2. Rename it to `eval - select item`\n3. Click the node → edit **Code** field → paste:\n\n```r\n# ── Load all items from the item bank ─────────────────────────────────────────\nitems \u003c- concerto.table.query(\"SELECT * FROM item_bank_3pl\")\n\n# ── Remove already-used items to prevent repetition ───────────────────────────\nif (length(used_items) \u003e 0) {\n  items \u003c- items[!items$id %in% used_items, ]\n}\n\n# ── Convert IRT parameter columns to numeric ───────────────────────────────────\nitems$difficulty     \u003c- as.numeric(items$difficulty)\nitems$discrimination \u003c- as.numeric(items$discrimination)\nitems$guessing       \u003c- as.numeric(items$guessing)\n\n# ── Extract IRT parameter vectors ─────────────────────────────────────────────\na \u003c- items$discrimination\nb \u003c- items$difficulty\nc \u003c- items$guessing\n\n# ── Step 1: Calculate P(θ) for each item using 3PL formula ───────────────────\n# P(θ) = c + (1-c) / (1 + exp(-a*(θ-b)))\nP \u003c- c + (1 - c) / (1 + exp(-a * (theta - b)))\n\n# ── Step 2: Calculate Item Information I(θ) ───────────────────────────────────\n# I(θ) = a² * [(P-c)²/(1-c)²] * [(1-P)/P]\n# Safety: prevent division by zero when P ≈ 0 or P ≈ 1\nP_safe \u003c- pmax(pmin(P, 0.9999), 0.0001)\nitems$information \u003c- (a^2) * ((P_safe - c)^2 / (1 - c)^2) * ((1 - P_safe) / P_safe)\n\n# ── Step 3: Select item with maximum information ───────────────────────────────\nselected \u003c- items[which.max(items$information), ]\n\n# ── Set question display variables ────────────────────────────────────────────\nquestion       \u003c- as.character(selected$question)\noption_a       \u003c- as.character(selected$option_a)\noption_b       \u003c- as.character(selected$option_b)\noption_c       \u003c- as.character(selected$option_c)\noption_d       \u003c- as.character(selected$option_d)\ncorrect_answer \u003c- as.character(selected$correct_answer)\ncurrent_id     \u003c- as.integer(selected$id)\n\n# ── Track this item as used ───────────────────────────────────────────────────\nused_items \u003c- c(used_items, current_id)\n```\n\n4. Click **Save**\n\n### Add input ports (↓)\n\nClick blue `+` for each. Click each port → check **Flow variable pointer** → Pointed variable name → **Save**:\n\n- `theta`\n- `answered`\n- `max_items`\n- `used_items`\n\n### Add output ports (↑)\n\nClick red `+` for each. Click each port → check **Flow variable pointer** → Pointed variable name → **Save**:\n\n- `question`\n- `option_a`\n- `option_b`\n- `option_c`\n- `option_d`\n- `correct_answer`\n- `current_id`\n- `used_items`\n- `answered`\n- `max_items`\n- `theta`\n\n### Connect\nDrag from `eval - init` **out** → `eval - select item` **in**\n\n\n### Details\n\nThe `eval - select item` node runs **at the start of every CAT loop iteration** — once before each question is shown. It is the implementation of the **CAT item selection algorithm**: given the current ability estimate $\\hat{\\theta}$, it selects the most informative unused item from the bank.\n\nIt performs four sequential tasks:\n\n| Task | Description |\n|---|---|\n| **Task 1** | Load all items from the database |\n| **Task 2** | Filter out already-
