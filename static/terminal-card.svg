  </clipPath>
  <text class="cmd" x="61" y="405" font-size="13" clip-path="url(#clipS)">cat ./stack.yaml</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>

    <text class="lbl" x="22" y="432"># languages</text>
    <rect x="22" y="438" width="58" height="20" rx="4" fill="#0d2045" stroke="#1158c7"/>
    <text class="badge-text" x="51" y="452" text-anchor="middle" fill="#79c0ff">Python</text>
    <rect x="86" y="438" width="84" height="20" rx="4" fill="#0d2045" stroke="#1158c7"/>
    <text class="badge-text" x="128" y="452" text-anchor="middle" fill="#79c0ff">JavaScript</text>
    <rect x="176" y="438" width="84" height="20" rx="4" fill="#0d2045" stroke="#1158c7"/>
    <text class="badge-text" x="218" y="452" text-anchor="middle" fill="#79c0ff">TypeScript</text>
    <rect x="266" y="438" width="45" height="20" rx="4" fill="#0d2045" stroke="#1158c7"/>
    <text class="badge-text" x="288.5" y="452" text-anchor="middle" fill="#79c0ff">Rust</text>
    <rect x="317" y="438" width="45" height="20" rx="4" fill="#0d2045" stroke="#1158c7"/>
    <text class="badge-text" x="339.5" y="452" text-anchor="middle" fill="#79c0ff">Dart</text>
    <rect x="368" y="438" width="45" height="20" rx="4" fill="#0d2045" stroke="#1158c7"/>
    <text class="badge-text" x="390.5" y="452" text-anchor="middle" fill="#79c0ff">Java</text>

    <text class="lbl" x="22" y="476"># frameworks</text>
    <rect x="22" y="482" width="64" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="54" y="496" text-anchor="middle" fill="#d2a8ff">FastAPI</text>
    <rect x="92" y="482" width="45" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="114.5" y="496" text-anchor="middle" fill="#d2a8ff">Axum</text>
    <rect x="143" y="482" width="58" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="172" y="496" text-anchor="middle" fill="#d2a8ff">Spring</text>
    <rect x="207" y="482" width="78" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="246" y="496" text-anchor="middle" fill="#d2a8ff">SvelteKit</text>
    <rect x="291" y="482" width="51" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="316.5" y="496" text-anchor="middle" fill="#d2a8ff">React</text>
    <rect x="348" y="482" width="58" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="377" y="496" text-anchor="middle" fill="#d2a8ff">NextJS</text>
    <rect x="412" y="482" width="64" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="444" y="496" text-anchor="middle" fill="#d2a8ff">Flutter</text>
    <rect x="482" y="482" width="71" height="20" rx="4" fill="#1e0d3d" stroke="#5a32aa"/>
    <text class="badge-text" x="517.5" y="496" text-anchor="middle" fill="#d2a8ff">Tailwind</text>
  </g>

  <line x1="22" y1="516" x2="618" y2="516" stroke="#161b22" stroke-width="1"/>

  <!-- ============ prompt 3: curl contact.json | jq ============ -->
  <text class="ps1" x="22" y="540" font-size="13">┌─(<tspan class="user">irufano</tspan>@github)─[~]</text>
  <text class="ps1" x="22" y="557" font-size="13">└──╼ </text>
  <clipPath id="clipC">
    <rect x="61" y="546" width="0" height="16">
      <animate attributeName="width" from="0" to="180" dur="0.6s" begin="2.3s" fill="freeze"/>
    </rect>
  </clipPath>
  <text class="cmd" x="61" y="557" font-size="13" clip-path="url(#clipC)">curl contact.json | jq</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.9s" fill="freeze"/>

    <text class="jb" x="22" y="585">{</text>
    <text x="38" y="603"><tspan class="jk">"github"</tspan><tspan class="jb" x="190">:</tspan><tspan class="jv" x="204">"github.com/irufano"</tspan><tspan class="jb">,</tspan></text>
    <text x="38" y="621"><tspan class="jk">"developer-portal"</tspan><tspan class="jb" x="190">:</tspan><tspan class="jv" x="204">"irufano.github.io"</tspan></text>
    <text class="jb" x="22" y="639">}</text>

    <rect x="22" y="653" width="100" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text class="soc-text" x="72" y="670" text-anchor="middle">⬡ GitHub</text>
    <rect x="132" y="653" width="160" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text class="soc-text" x="212" y="670" text-anchor="middle">◈ Developer Portal</text>
  </g>

  <!-- ============ footer ============ -->
  <line x1="22" y1="697" x2="618" y2="697" stroke="#161b22" stroke-width="1"/>
  <text class="footer-msg" x="22" y="717">$ exit  ·  see you in the commits</text>
  <rect x="610" y="705" width="8" height="14" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  </g>
</svg>
