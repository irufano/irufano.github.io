<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 931.25" width="800" height="931.25" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace">
  <title>irufano — terminal profile card</title>

  <style>
    text { dominant-baseline: alphabetic; }
    .ps1 { fill: #39d353; }
    .user { fill: #79c0ff; }
    .cmd { fill: #c9d1d9; }
    .k { fill: #d2a8ff; font-size: 12px; }
    .sep { fill: #484f58; font-size: 12px; }
    .v { fill: #e6edf3; font-size: 12px; }
    .lbl { fill: #484f58; font-size: 11px; }
    .badge-text { font-size: 11px; }
    .jk { fill: #d2a8ff; font-size: 12px; }
    .jv { fill: #79c0ff; font-size: 12px; }
    .jb { fill: #8b949e; font-size: 12px; }
    .soc-text { fill: #8b949e; font-size: 11px; }
    .footer-msg { fill: #484f58; font-size: 11px; }
    .title-text { fill: #6e7681; font-size: 11px; letter-spacing: .04em; }
    .ascii { font-size: 16px; fill: url(#logoGrad); }
  </style>

  <defs>
    <linearGradient id="logoGrad" x1="22" y1="0" x2="616" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5a32aa"/>
      <stop offset="100%" stop-color="#375bfa"/>
    </linearGradient>
  </defs>

  <g transform="scale(1.25)">
  <!-- card background -->
  <rect x="0.5" y="0.5" width="639" height="744" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- titlebar -->
  <path d="M10,0 H630 A10,10 0 0 1 640,10 V42 H0 V10 A10,10 0 0 1 10,0 Z" fill="#161b22"/>
  <line x1="0" y1="42" x2="640" y2="42" stroke="#21262d" stroke-width="1"/>
  <circle cx="28" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="64" cy="21" r="6" fill="#28c840"/>
  <text class="title-text" x="320" y="25" text-anchor="middle">irufano — bash — 72×30</text>

  <!-- ============ prompt 1: whoami ============ -->
  <text class="ps1" x="22" y="75" font-size="13">┌─(<tspan class="user">irufano</tspan>@github)─[~]</text>
  <text class="ps1" x="22" y="92" font-size="13">└──╼ </text>
  <clipPath id="clipW">
    <rect x="61" y="81" width="0" height="16">
      <animate attributeName="width" from="0" to="47" dur="0.6s" begin="0.1s" fill="freeze"/>
    </rect>
  </clipPath>
  <text class="cmd" x="61" y="92" font-size="13" clip-path="url(#clipW)">whoami</text>

  <!-- ASCII-art "irufano" wordmark, shown before the whoami box -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
    <text class="ascii" xml:space="preserve" x="22" y="130" textLength="594" lengthAdjust="spacingAndGlyphs">██╗██████╗ ██╗   ██╗███████╗ █████╗ ███╗   ██╗ ██████╗ </text>
    <text class="ascii" xml:space="preserve" x="22" y="147" textLength="594" lengthAdjust="spacingAndGlyphs">██║██╔══██╗██║   ██║██╔════╝██╔══██╗████╗  ██║██╔═══██╗</text>
    <text class="ascii" xml:space="preserve" x="22" y="164" textLength="594" lengthAdjust="spacingAndGlyphs">██║██████╔╝██║   ██║█████╗  ███████║██╔██╗ ██║██║   ██║</text>
    <text class="ascii" xml:space="preserve" x="22" y="181" textLength="594" lengthAdjust="spacingAndGlyphs">██║██╔══██╗██║   ██║██╔══╝  ██╔══██║██║╚██╗██║██║   ██║</text>
    <text class="ascii" xml:space="preserve" x="22" y="198" textLength="594" lengthAdjust="spacingAndGlyphs">██║██║  ██║╚██████╔╝██║     ██║  ██║██║ ╚████║╚██████╔╝</text>
    <text class="ascii" xml:space="preserve" x="22" y="215" textLength="594" lengthAdjust="spacingAndGlyphs">╚═╝╚═╝  ╚═╝ ╚═════╝ ╚═╝     ╚═╝  ╚═╝╚═╝  ╚═══╝ ╚═════╝ </text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <!-- whoami output box -->
    <rect x="22" y="233" width="596" height="117" rx="6" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="38" y="255"><tspan class="k">name</tspan><tspan class="sep" x="112">›</tspan><tspan class="v" x="126">irufano</tspan></text>
    <text x="38" y="274"><tspan class="k">role</tspan><tspan class="sep" x="112">›</tspan><tspan class="v" x="126" fill="#ffa657">Software Engineer</tspan><tspan class="v"> &amp; </tspan><tspan class="v" fill="#d2a8ff">AI Engineer</tspan></text>
    <text x="38" y="293"><tspan class="k">location</tspan><tspan class="sep" x="112">›</tspan><tspan class="v" x="126">Indonesia 🇮🇩</tspan></text>
    <text x="38" y="312"><tspan class="k">focus</tspan><tspan class="sep" x="112">›</tspan><tspan class="v" x="126">Software Development, AI Agent Development</tspan></text>
    <text x="38" y="331"><tspan class="k">status</tspan><tspan class="sep" x="112">›</tspan><tspan class="v" x="126" fill="#39d353">●</tspan><tspan class="v"> online — building something cool</tspan></text>
  </g>

  <line x1="22" y1="364" x2="618" y2="364" stroke="#161b22" stroke-width="1"/>

  <!-- ============ prompt 2: cat ./stack.yaml ============ -->
