  <text class="ps1" x="22" y="405" font-size="13">└──╼ </text>
  <clipPath id="clipS">
    <rect x="61" y="394" width="0" height="16">
      <animate attributeName="width" from="0" to="125" dur="0.6s" begin="1.3s" fill="freeze"/>
